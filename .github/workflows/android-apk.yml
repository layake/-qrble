# Fabrique l'APK Android du jeu Billes à chaque mise à jour de la page du jeu.
# L'APK est publié dans la Release « apk-latest » : lien direct, sans zip et sans compte GitHub :
# https://github.com/layake/-qrble/releases/download/apk-latest/Billes.apk
name: APK Android

on:
  push:
    paths:
      - 'web/billes.html'
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Pages du jeu
        run: node scripts/build-www.mjs

      - name: Projet Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compilation de l'APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Billes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: billes-apk
          path: android-app/Billes.apk
          retention-days: 30

      - name: Publier dans la Release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Billes (dernière version)
          body: |
            APK de test du jeu Billes, refait à chaque mise à jour du jeu.
            Sur Android : télécharge Billes.apk, ouvre-le et autorise l'installation.
            Version du ${{ github.sha }}.
          prerelease: true
          files: android-app/Billes.apk

  const TYPE_ID = { opaque: 0, milky: 1, agate: 2, pearl: 4, cateye: 6, swirl: 7, tornado: 8, mica: 9, lutz: 10, clear: 12, clay: 13, nugget: 14, galaxy: 15, spider: 16, clambroth: 17, gold: 19, silver: 20, diamond: 21 };
  const GLASS_TYPES = ['cateye', 'swirl', 'tornado', 'mica', 'lutz', 'clear', 'nugget', 'spider', 'diamond'];
  /* Tourbillon : 0 fil fin et cœur argenté, 2 bille opaque à rubans. Tornade : 1 rubans épais opaques dans le verre, 3 rubans translucides. */
  const ribbonVariantOf = (def) => {
    const x = rng(def.seed + 11)();
    if (def.type === 'swirl') return x < 0.65 ? 0 : 2;
    if (def.type === 'spider') return x < 0.7 ? 0 : 1;
    if (def.type === 'nugget') return x < 0.35 ? 0 : x < 0.75 ? 1 : 2;
    if (def.type === 'agate') return x < 0.55 ? 0 : x < 0.8 ? 1 : 2;
    return x < 0.7 ? 1 : 3;
  };
  const isGlass = (def) => GLASS_TYPES.includes(def.type) && !(def.type === 'swirl' && ribbonVariantOf(def) === 2) && !(def.type === 'spider' && ribbonVariantOf(def) === 0) && !(def.type === 'nugget' && ribbonVariantOf(def) !== 1);

  /* Album : une case par coloris. Le coloris se déduit des mêmes tirages que le dessin de la bille,
     donc la case correspond toujours à ce qu'on voit. */
  function entryOf(def) {
    const t = def.type;
    const fam = hueFamily(def.hue);
    if (t === 'gold' || t === 'silver' || t === 'diamond') return t;
    if (t === 'cateye') return rng(def.seed + 17)() < 0.6 ? 'cateye:trio' : 'cateye:' + fam;
    if (t === 'swirl') return 'swirl:' + (ribbonVariantOf(def) === 0 ? 'fil' : 'plein') + ':' + fam;
    if (t === 'tornado') return 'tornado:' + (ribbonVariantOf(def) === 1 ? 'ruban' : 'voile') + ':' + fam;
    if (t === 'spider') return ribbonVariantOf(def) === 1 ? 'spider:cristal' : 'spider:' + ['rouge', 'bleu', 'vert'][Math.floor(rng(def.seed + 29)() * 3)];
    if (t === 'nugget') return 'nugget:' + ['nuit', 'cristal', 'opaque'][ribbonVariantOf(def)];
    if (t === 'agate') return 'agate:' + ['rouge', 'orange', 'bleu', 'vert', 'jaune', 'sombre'][Math.floor(rng(def.seed + 43)() * 6)];
    if (t === 'galaxy') return 'galaxy:' + ['nuit', 'nuit', 'jaune', 'rouge', 'vert', 'ciel'][Math.floor(rng(def.seed + 37)() * 6)];
    return t + ':' + fam;
  }
  const ALBUM = (function () {
    const list = [];
    const add = (type, key, label) => list.push({ type: type, key: key, label: label });
    const byHue = (type, prefix, word) => HUE_FAMILIES.forEach(function (f) {
      add(type, type + ':' + (prefix ? prefix + ':' : '') + f.id, word ? word + ' ' + f.name.toLowerCase() : f.name);
    });
    TYPES.forEach(function (t) {
      if (t === 'gold' || t === 'silver' || t === 'diamond') add(t, t, CATALOG[t].name);
      else if (t === 'cateye') { add(t, 'cateye:trio', 'Classique'); byHue(t); }
      else if (t === 'swirl') { byHue(t, 'fil', 'Fil'); byHue(t, 'plein', 'Plein'); }
      else if (t === 'tornado') { byHue(t, 'ruban', 'Ruban'); byHue(t, 'voile', 'Voile'); }
      else if (t === 'spider') [['rouge', 'Rouge'], ['bleu', 'Bleu'], ['vert', 'Vert'], ['cristal', 'Cristal']].forEach((v) => add(t, 'spider:' + v[0], v[1]));
      else if (t === 'nugget') [['nuit', 'Nuit'], ['cristal', 'Cristal'], ['opaque', 'Opaque']].forEach((v) => add(t, 'nugget:' + v[0], v[1]));
      else if (t === 'agate') [['rouge', 'Rouge'], ['orange', 'Orange'], ['jaune', 'Jaune'], ['vert', 'Vert'], ['bleu', 'Bleu'], ['sombre', 'Sombre']].forEach((v) => add(t, 'agate:' + v[0], v[1]));
      else if (t === 'galaxy') [['nuit', 'Nuit'], ['ciel', 'Ciel'], ['vert', 'Vert'], ['jaune', 'Jaune'], ['rouge', 'Rouge']].forEach((v) => add(t, 'galaxy:' + v[0], v[1]));
      else byHue(t);
    });
    return list;
  })();
  const ALBUM_KEYS = new Set(ALBUM.map((e) => e.key));

  const SUN_DIR = new THREE.Vector3(-6, 14, 6).normalize();
  const GROUND_DUEL = new THREE.Color(0x6b737b).convertSRGBToLinear();
  const GROUND_THUMB = new THREE.Color(0xb8bec5).convertSRGBToLinear();
  const unitSphere = new THREE.SphereGeometry(1, 64, 48);
  const tmpInv = new THREE.Matrix4();
  const tmpRot = new THREE.Matrix4();

  const linColor = (h, s, l) => new THREE.Color().setHSL((((h % 360) + 360) % 360) / 360, s, l).convertSRGBToLinear();

  /* La tache de l'agate est placée face à la caméra des miniatures du sac (la bille y est toujours tournée pareil). */
  const THUMB_EULER = new THREE.Euler(0.35, -0.6, 0.15);
  function patchDirection(def) {
    const r = rng(def.seed + 47);
    const facing = new THREE.Vector3(0.1 + (r() - 0.5) * 0.5, 0.35 + (r() - 0.5) * 0.4, 1).normalize();
    return facing.applyQuaternion(new THREE.Quaternion().setFromEuler(THUMB_EULER).invert());
  }

  function marbleMaterial(def, ground) {
    const r = rng(def.seed);
    const h = def.hue;
    /* Verre clair : légère teinte bleu-vert, comme le verre réel. Verre teinté pour Mica et Lutz. */
    /* Tourbillon : verre clair, turquoise, bleu ou ambre, comme sur les vraies billes. */
    const swirlTint = [null, 185, 215, 40][Math.floor(rng(def.seed + 3)() * 4)];
    const tint = def.type === 'swirl' ? linColor(swirlTint || 0, 0.55, 0.6) : linColor(h, 0.7, 0.45);
    const swirlVariant = ['swirl', 'tornado', 'spider', 'nugget', 'agate'].includes(def.type) ? ribbonVariantOf(def) : 1;
    const strength = def.type === 'swirl' ? (swirlVariant === 0 && swirlTint ? 0.9 : undefined) : { mica: 2.2, clear: 1.1, nugget: 0.9 }[def.type];
    const absorb = strength
      ? new THREE.Vector3(1 - tint.r, 1 - tint.g, 1 - tint.b).multiplyScalar(strength)
      : def.type === 'cateye' ? new THREE.Vector3(0.15, 0.06, 0.4) : def.type === 'lutz' ? new THREE.Vector3(0.08, 0.04, 0.06) : new THREE.Vector3(0.35, 0.12, 0.2);
    /* Œil de chat : trio classique jaune, rouge-orange, bleu, ou une seule couleur avec des nuances. */
    const catPal = def.type === 'cateye'
      ? (rng(def.seed + 17)() < 0.6
        ? [linColor(50, 0.95, 0.52), linColor(12, 0.9, 0.5), linColor(225, 0.85, 0.42)]
          .sort(((pr) => () => pr() - 0.5)(rng(def.seed + 19)))
        : [linColor(h, 0.85, 0.5), linColor(h + 8, 0.85, 0.6), linColor(h - 8, 0.85, 0.42)])
      : def.type === 'spider'
        ? (swirlVariant === 0
          ? [linColor([2, 205, 135][Math.floor(rng(def.seed + 29)() * 3)], 0.8, 0.38), linColor(50, 0.95, 0.55), linColor(140, 0.6, 0.5)]
          : [linColor(0, 0, 0.9), linColor(32, 0.95, 0.5), linColor(5, 0.9, 0.45)])
        : def.type === 'nugget'
          ? [swirlVariant === 0 ? new THREE.Color(0.012, 0.014, 0.03) : rng(def.seed + 31)() < 0.5 ? new THREE.Color(0.82, 0.82, 0.8) : new THREE.Color(0.75, 0.6, 0.08),
            [new THREE.Color(0.95, 0.95, 0.95), new THREE.Color(0.95, 0.8, 0.1), new THREE.Color(0.12, 0.3, 0.75), new THREE.Color(0.2, 0.55, 0.15), new THREE.Color(0.8, 0.1, 0.08)][Math.floor(rng(def.seed + 33)() * 5)],
            new THREE.Color(1, 1, 1)]
          : def.type === 'galaxy'
            ? [[new THREE.Color(0.05, 0.12, 0.6), new THREE.Color(0.04, 0.1, 0.5), new THREE.Color(0.8, 0.7, 0.05), new THREE.Color(0.6, 0.06, 0.03), new THREE.Color(0.1, 0.32, 0.14), new THREE.Color(0.35, 0.45, 0.8)][Math.floor(rng(def.seed + 37)() * 6)],
              rng(def.seed + 39)() < 0.5 ? new THREE.Color(0.85, 0.88, 0.92) : new THREE.Color(0.5, 0.65, 0.95), new THREE.Color(1, 1, 1)]
            : def.type === 'agate'
              ? (function () {
                const ar = rng(def.seed + 43);
                const pal = [linColor(5, 0.85, 0.48), linColor(22, 0.95, 0.52), linColor(225, 0.7, 0.55), linColor(130, 0.55, 0.45), linColor(50, 0.9, 0.55), linColor(10, 0.5, 0.15)];
                const i = Math.floor(ar() * pal.length);
                return [pal[i], pal[(i + 1 + Math.floor(ar() * (pal.length - 1))) % pal.length], new THREE.Color(1, 1, 1)];
              })()
              : null;
    const uniforms = {
      uType: { value: TYPE_ID[def.type] },
      uVariant: { value: swirlVariant },
      uDir: { value: patchDirection(def) },
      uDensity: { value: def.type === 'nugget' ? [0.92, 0.6, 0.7][swirlVariant] : def.type === 'galaxy' ? 0.15 + rng(def.seed + 41)() * 0.8 : 0.5 },
      uSeed: { value: r() },
      uCount: { value: 3 + Math.floor(r() * 2) },
      uTwist: { value: def.type === 'swirl' ? (r() < 0.5 ? -1 : 1) * (2.6 + r() * 1.2) : def.type === 'tornado' ? (r() < 0.5 ? -1 : 1) * (6.5 + r() * 2.5) : (r() - 0.5) * 1.2 },
      uWidth: { value: def.type === 'cateye' ? 0.4 + r() * 0.12 : def.type === 'nugget' ? [12, 9, 8][swirlVariant] + r() * 3 : 0.3 + r() * 0.14 },
      uC1: { value: catPal ? catPal[0] : def.type === 'clay' ? linColor(h, 0.45, 0.42) : linColor(h, 0.85, def.type === 'opaque' ? 0.45 : 0.5) },
      uC2: { value: catPal ? catPal[1] : def.type === 'tornado' && rng(def.seed + 5)() < 0.3 ? new THREE.Color(0.9, 0.9, 0.88) : linColor(h + (def.type === 'tornado' ? 40 + r() * 160 : 110 + r() * 80), 0.85, 0.55) },
      uC3: { value: catPal ? catPal[2] : linColor(h + 240, 0.8, 0.55) },
      uAbsorb: { value: absorb },
      uCamObj: { value: new THREE.Vector3() },
      uRot: { value: new THREE.Matrix3() },
      uSun: { value: SUN_DIR },
      uGround: { value: ground }
    };
    return new THREE.ShaderMaterial({ uniforms: uniforms, vertexShader: MARBLE_VS, fragmentShader: MARBLE_FS });
  }

  function buildMarbleVisual(def, ground) {
    const mat = marbleMaterial(def, ground || GROUND_DUEL);
    const mesh = new THREE.Mesh(unitSphere, mat);
    mesh.scale.setScalar(R);
    mesh.onBeforeRender = function (rend, sc, cam) {
      tmpInv.copy(this.matrixWorld).invert();
      mat.uniforms.uCamObj.value.setFromMatrixPosition(cam.matrixWorld).applyMatrix4(tmpInv);
      tmpRot.extractRotation(this.matrixWorld);
      mat.uniforms.uRot.value.setFromMatrix4(tmpRot);
    };
    return mesh;
  }

  /* Ombre au sol : une bille pleine fait une ombre douce, une bille de verre concentre la lumière au centre. */
  function radialTexture(stops) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(function (st) { gr.addColorStop(st[0], st[1]); });
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    return makeTexture(c);
  }
  const SHADOW_TEX = radialTexture([[0, 'rgba(0,0,0,0.62)'], [0.45, 'rgba(0,0,0,0.42)'], [0.75, 'rgba(0,0,0,0.12)'], [1, 'rgba(0,0,0,0)']]);
  const CAUSTIC_TEX = radialTexture([[0, 'rgba(255,255,255,0.9)'], [0.18, 'rgba(255,255,255,0.45)'], [0.36, 'rgba(0,0,0,0.12)'], [0.6, 'rgba(0,0,0,0.32)'], [0.8, 'rgba(0,0,0,0.12)'], [1, 'rgba(0,0,0,0)']]);
  const shadowGeo = new THREE.PlaneGeometry(1, 1);

  function makeShadow() {
    const m = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ map: SHADOW_TEX, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.scale.setScalar(R * 3);
    m.renderOrder = 1;
    return m;
  }

  function styleShadow(shadow, def) {
    const glassy = isGlass(def);
    shadow.material.map = glassy ? CAUSTIC_TEX : SHADOW_TEX;
    shadow.material.color.copy(glassy ? linColor(def.hue, 0.6, 0.75) : new THREE.Color(1, 1, 1));
    shadow.material.needsUpdate = true;
  }

  function disposeVisual(obj) {
    obj.traverse(function (o) {
      if (o.geometry && o.geometry !== unitSphere && o.geometry !== shadowGeo) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
  }

  /* Miniatures : rendues par le moteur 3D principal dans une image hors écran (le gros programme des billes n'est compilé
     qu'une fois pour tout le jeu), en double taille puis réduites pour lisser les bords, et gardées en cache.
     Une seule bille de rendu est réutilisée : on ne fait que changer ses réglages, sans recompiler. */
  const THUMB_RT = 320;
  const thumbScene = new THREE.Scene();
  const thumbCam = new THREE.PerspectiveCamera(30, 1, 0.1, 10);
  thumbCam.position.set(0, 0.45, 1.2);
  thumbCam.lookAt(0, -0.02, 0);
  const thumbCache = new Map();
  /* Les miniatures sont rendues plus grandes puis réduites (le bord reste lisse). La grande bille de l'accueil
     a sa propre cible, plus fine, car elle est affichée en grand sur des écrans très denses. */
  const HERO_PX = 640;
  const HERO_RT = 1024;
  const thumbTargets = {};
  function thumbTargetOf(n) {
    if (thumbTargets[n]) return thumbTargets[n];
    const target = new THREE.WebGLRenderTarget(n, n);
    target.texture.encoding = THREE.sRGBEncoding;
    const full = document.createElement('canvas');
    full.width = full.height = n;
    const ctx = full.getContext('2d');
    thumbTargets[n] = { n: n, target: target, pixels: new Uint8Array(n * n * 4), full: full, ctx: ctx, image: ctx.createImageData(n, n) };
    return thumbTargets[n];
  }
  const thumbOut = document.createElement('canvas');
  const thumbOutCtx = thumbOut.getContext('2d');
  const prevClear = new THREE.Color();
  let thumbMesh = null;

  function thumbUrl(def, size) {
    const px = size || 160;
    const key = def.type + ':' + def.hue + ':' + def.seed + ':' + px;
    let url = thumbCache.get(key);
    if (url) return url;
    const temp = marbleMaterial(def, GROUND_THUMB);
    if (!thumbMesh) {
      thumbMesh = buildMarbleVisual(def, GROUND_THUMB);
      thumbScene.add(thumbMesh);
    } else {
      Object.keys(temp.uniforms).forEach(function (k) {
        const u = thumbMesh.material.uniforms[k];
        const val = temp.uniforms[k].value;
        if (val && typeof val.copy === 'function') u.value.copy(val); else u.value = val;
      });
    }
    temp.dispose();
    /* Chaque œil de chat et chaque araignée est posé dans un sens différent, comme dans un vrai sac de billes. */
    const tilt = def.type === 'cateye' || def.type === 'spider' ? rng(def.seed + 23) : null;
    thumbMesh.rotation.set(tilt ? (tilt() - 0.5) * 2.6 : 0.35, -0.6, tilt ? (tilt() - 0.5) * 2.6 : 0.15);
    const prevTarget = renderer.getRenderTarget();
    const prevAlpha = renderer.getClearAlpha();
    renderer.getClearColor(prevClear);
    const rt = thumbTargetOf(px > THUMB_RT ? HERO_RT : THUMB_RT);
    const N = rt.n;
    renderer.setRenderTarget(rt.target);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(thumbScene, thumbCam);
    renderer.readRenderTargetPixels(rt.target, 0, 0, N, N, rt.pixels);
    renderer.setRenderTarget(prevTarget);
    renderer.setClearColor(prevClear, prevAlpha);
    const row = N * 4;
    for (let y = 0; y < N; y++) rt.image.data.set(rt.pixels.subarray((N - 1 - y) * row, (N - y) * row), y * row);
    rt.ctx.putImageData(rt.image, 0, 0);
    thumbOut.width = thumbOut.height = px;
    thumbOutCtx.clearRect(0, 0, px, px);
    thumbOutCtx.imageSmoothingEnabled = true;
    thumbOutCtx.imageSmoothingQuality = 'high';
    thumbOutCtx.drawImage(rt.full, 0, 0, px, px);
    url = thumbOut.toDataURL('image/png');
    thumbCache.set(key, url);
    /* Mémoire bornée : on oublie les miniatures les plus anciennes (elles seront refaites si besoin). */
    if (thumbCache.size > THUMB_CACHE_MAX) thumbCache.delete(thumbCache.keys().next().value);
    return url;
  }

  function makeMarble() {
    const mesh = new THREE.Group();
    scene.add(mesh);
    const shadow = makeShadow();
    scene.add(shadow);
    const body = new CANNON.Body({ mass: 1, material: mMarble });
    body.addShape(new CANNON.Sphere(R));
    world.addBody(body);
    return { mesh: mesh, body: body, shadow: shadow };
  }
  const marbles = [makeMarble(), makeMarble()];

  function setLook(i, def) {
    const holder = marbles[i].mesh;
    holder.children.slice().forEach(function (c) {
      holder.remove(c);
      disposeVisual(c);
    });
    holder.add(buildMarbleVisual(def));
    styleShadow(marbles[i].shadow, def);
  }

  function placeShadows() {
    marbles.forEach(function (m) {
      m.shadow.visible = m.mesh.visible;
      if (!m.mesh.visible) return;
      const p = m.mesh.position;
      const floorY = terrain === 'terre' ? p.y - R - potDepthAt(p.x + R * 0.38, p.z - R * 0.38) + potDepthAt(p.x, p.z) : Math.max(p.y - R, groundY());
      m.shadow.position.set(p.x + R * 0.38, floorY + 0.004, p.z - R * 0.38);
    });
  }

  marbles.forEach(function (m, i) {
    m.body.addEventListener('collide', function (e) {
      const iv = Math.abs(e.contact.getImpactVelocityAlongNormal());
      if (e.body === marbles[1 - i].body) {
        if (i === 0 && iv > 0.3) { playClink(iv); buzz(20 + Math.min(40, iv * 4)); }
        /* Règle de la cour : le premier tir de la partie sert à se placer, il ne peut pas tiquer. */
        if (game.phase === 'rolling' && game.shotCount > 1) finish(game.turn);
      } else if (e.body.material === mWall) {
        if (iv > 0.5) playThud(iv);
      } else if (terrain === 'plate' && e.body !== groundBody) {
        if (iv > 0.6) playClack(iv);
      } else if (iv > 2.5) {
        playThud(iv * 0.4);
      }
    });
  });

  let terrain = 'tarmac';
  const groundY = () => (terrain === 'plate' ? -COVER.depth : 0);

  function setTerrain(name) {
    terrain = name;
    const t = TERRAINS[name];
    const plate = name === 'plate';
    cmGround.friction = t.friction;
    marbles.forEach(function (m) {
      m.body.linearDamping = 0.01;
      m.body.angularDamping = 0.01;
    });
    groundBody.position.y = groundY();
    const terre = name === 'terre';
    tarmacFull.visible = name === 'tarmac';
    tarmacAround.visible = plate;
    coverGroup.visible = plate;
    tarmacGroup.visible = name === 'tarmac';
    terreGround.visible = terre;
    potMesh.visible = terre;
    terreGroup.visible = terre;
    coverBodies.forEach(function (b) { b.position.y = plate ? b.restY : -50; b.aabbNeedsUpdate = true; });
    tarmacBodies.forEach(function (b) { b.position.y = plate ? -50 : b.restY; b.aabbNeedsUpdate = true; });
  }

  const snapToCell = (v) => (Math.floor(v / COVER.cell) + 0.5) * COVER.cell;

  function randomSpots() {
    if (terrain !== 'plate') {
      /* Départ de part et d'autre du terrain, à environ 20 à 27 cm l'un de l'autre. */
      const zA = (Math.random() * 2 - 1) * 3.5;
      return [
        { x: -(4 + Math.random() * 1.2), z: zA },
        { x: 4 + Math.random() * 1.2, z: -zA * (0.3 + Math.random() * 0.7) }
      ];
    }
    /* Sur la plaque : deux cases au hasard dans le disque, à bonne distance. */
    for (;;) {
      const spots = [0, 1].map(function () {
        const a = Math.random() * Math.PI * 2;
        const d = 3.5 + Math.random() * (COVER.r - 4.7);
        return { x: snapToCell(Math.cos(a) * d), z: snapToCell(Math.sin(a) * d) };
      });
      const gap = Math.hypot(spots[0].x - spots[1].x, spots[0].z - spots[1].z);
      const far = gap > 6 && gap < 10;
      if (far && !spots.some((s) => Math.hypot(s.x, s.z) > COVER.r - 0.8)) return spots;
    }
  }

  function placeAt(i, spot) {
    const b = marbles[i].body;
    b.position.set(spot.x, groundY() + R + 0.001, spot.z);
    b.velocity.set(0, 0, 0);
    b.angularVelocity.set(0, 0, 0);
    b.quaternion.set(0, 0, 0, 1);
    marbles[i].mesh.visible = true;
  }

  function hideMarble(i) {
    marbles[i].body.position.set(0, -50, 0);
    marbles[i].mesh.visible = false;
  }

  /* Résistance au roulement : la bille perd de la vitesse régulièrement puis s'arrête net (pas de longue traîne).
     Sur le goudron, les gros gravillons font dévier la bille, toujours au même endroit, plus un léger aléa de sable. */
  const stoneOut = { x: 0, z: 0 };
  function terrainEffects(m) {
    const v = m.body.velocity;
    const w = m.body.angularVelocity;
    const speed = Math.sqrt(v.x * v.x + v.z * v.z);
    if (speed < 0.15 && Math.abs(v.y) < 0.3) {
      v.set(0, v.y, 0);
      w.set(0, 0, 0);
      return;
    }
    const t = TERRAINS[terrain];
    if (Math.abs(v.y) < 1.5 && speed > 1e-6) {
      const f = Math.max(0, speed - t.roll * STEP) / speed;
      v.x *= f; v.z *= f;
      w.x *= f; w.y *= f; w.z *= f;
    }
    if (terrain === 'terre') {
      const p = m.body.position;
      if (potDepthAt(p.x, p.z) > 0) {
        const k = (G * 2 * POT.depth) / (POT.r * POT.r);
        v.x -= k * p.x * STEP;
        v.z -= k * p.z * STEP;
      }
      const kk = Math.min(speed / 6, 1) * t.sand;
      v.x += (Math.random() - 0.5) * kk;
      v.z += (Math.random() - 0.5) * kk;
    }
    if (terrain === 'tarmac') {
      stoneAccel(m.body.position.x, m.body.position.z, stoneOut);
      v.x += stoneOut.x * STEP;
      v.z += stoneOut.z * STEP;
      const k = Math.min(speed / 6, 1) * t.sand;
      v.x += (Math.random() - 0.5) * k;
      v.z += (Math.random() - 0.5) * k;
    }
  }

  /* Sécurité : une bille qui saute par-dessus le mur bas est renvoyée dans le terrain. */
  function keepInside(m) {
    const p = m.body.position;
    const v = m.body.velocity;
    if (!m.mesh.visible) return;
    if (terrain === 'plate') {
      const lim = COVER.r - R;
      const d = Math.hypot(p.x, p.z);
      if (d <= lim) return;
      const nx = p.x / d;
      const nz = p.z / d;
      p.x = nx * lim;
      p.z = nz * lim;
      const vn = v.x * nx + v.z * nz;
      if (vn > 0) { v.x -= 1.6 * vn * nx; v.z -= 1.6 * vn * nz; }
      return;
    }
    const lim = HALF - R;
    if (Math.abs(p.x) > lim) { p.x = Math.sign(p.x) * lim; if (v.x * p.x > 0) v.x *= -0.6; }
    if (Math.abs(p.z) > lim) { p.z = Math.sign(p.z) * lim; if (v.z * p.z > 0) v.z *= -0.6; }
  }

  const allStill = () => marbles.every((m) => Math.abs(m.body.velocity.x) + Math.abs(m.body.velocity.z) < 0.01);

  /* ================= Sac de billes ================= */
  function newBag() {
    return { marbles: [makeDef('opaque'), makeDef('cateye'), makeDef('milky')], tickets: 0, nextPackAt: 0, stakeUid: null };
  }

  function sanitizeBag(o) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.marbles)) return null;
    const seen = new Set();
    const list = [];
    o.marbles.forEach(function (d) {
      const s = sanitizeDef(d);
      if (s && !seen.has(s.uid)) { seen.add(s.uid); list.push(s); }
    });
    return {
      marbles: list,
      tickets: Math.max(0, Math.floor(Number(o.tickets) || 0)),
      nextPackAt: Number(o.nextPackAt) || 0,
      stakeUid: typeof o.stakeUid === 'string' ? o.stakeUid : null,
      found: sanitizeFound(o, list)
    };
  }

  /* Coloris déjà trouvés : clé du coloris vers [teinte, graine] de la première bille trouvée (pour la dessiner dans l'album). */
  function sanitizeFound(o, list) {
    const found = {};
    if (o.found && typeof o.found === 'object') {
      Object.keys(o.found).forEach(function (k) {
        const v = o.found[k];
        if (ALBUM_KEYS.has(k) && Array.isArray(v) && v.length === 2 && v.every((x) => Number.isFinite(Number(x)))) found[k] = [Math.floor(Number(v[0])) % 360, Math.floor(Math.abs(Number(v[1]))) || 1];
      });
    } else if (Array.isArray(o.seen)) {
      /* Ancien album (un seul exemplaire par type) : chaque type déjà vu garde au moins un coloris. */
      o.seen.map((t) => RETIRED_TYPES[t] || t).forEach(function (t) {
        if (!Object.prototype.hasOwnProperty.call(CATALOG, t) || list.some((m) => m.type === t)) return;
        const d = makeDef(t);
        found[entryOf(d)] = [d.hue, d.seed];
      });
    }
    return found;
  }

  function loadLocal() {
    try { return sanitizeBag(JSON.parse(localStorage.getItem(LS_KEY))); } catch (e) { return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(bag)); } catch (e) { /* stockage indisponible */ }
  }

  let bag = loadLocal() || newBag();
  let bagDoc = null;
  let writing = false;
  let dirty = false;

  /* Album : on retient chaque coloris déjà possédé, même si la bille a été perdue ou défaussée depuis. */
  function markSeen() {
    if (!bag.found || typeof bag.found !== 'object') bag.found = {};
    bag.marbles.forEach(function (m) {
      const k = entryOf(m);
      if (!bag.found[k]) bag.found[k] = [m.hue, m.seed];
    });
  }

  function persist() {
    markSeen();
    saveLocal();
    if (bagDoc) flush();
  }

  async function flush() {
    if (writing) { dirty = true; return; }
    writing = true;
    try {
      do {
        dirty = false;
        await bagDoc.set(JSON.parse(JSON.stringify(bag)));
      } while (dirty);
    } catch (e) {
      bagDoc = null;
    }
    writing = false;
  }

  const getStake = () => bag.marbles.find((m) => m.uid === bag.stakeUid) || null;

  function removeMarble(uid) {
    bag.marbles = bag.marbles.filter((m) => m.uid !== uid);
    if (bag.stakeUid === uid) bag.stakeUid = null;
  }

  /* ================= Partie ================= */
  const game = {
    active: false, mode: null, phase: 'idle', turn: 0, rollTime: 0, trackAcc: 0,
    my: null, opp: null, oppName: '', net: null, targets: null, lastNetAt: 0
  };
  let botTimer = null;

  function startMatch(opts) {
    clearTimeout(botTimer);
    showView('play');
    game.active = true;
    game.mode = opts.mode;
    game.my = opts.my;
    game.opp = opts.opp;
    game.oppName = opts.oppName;
    game.net = opts.net || null;
    game.targets = null;
    setTerrain(opts.terrain);
    setLook(0, opts.my);
    setLook(1, opts.opp);
    placeAt(0, opts.spots[0]);
    placeAt(1, opts.spots[1]);
    $('banner').hidden = true;
    game.turn = opts.starter;
    game.shotCount = 0;
    if (game.net) setPresence('playing');
    $('turnPill').hidden = false;
    renderAll();
    resize();
    showVsIntro(opts);
    beginTurn();
  }

  /* Entrée en scène : les deux billes arrivent de chaque côté, « VS », le terrain et l'enjeu. */
  let introUntil = 0;
  function showVsIntro(opts) {
    const prize = TICKETS_BY_RARITY[rarityOf(opts.my)];
    $('vsMe').replaceChildren(thumbCanvas(opts.my, 84));
    $('vsOpp').replaceChildren(thumbCanvas(opts.opp, 84));
    $('vsOppName').textContent = opts.oppName;
    $('vsTerrain').textContent = TERRAIN_NAMES[opts.terrain];
    $('vsInfo').textContent = 'Le gagnant prend la bille de l\'autre et ' + ticketsText(prize) + '.';
    const el = $('vsIntro');
    el.hidden = false;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    introUntil = performance.now() + 2000;
    clearTimeout(showVsIntro.t);
    showVsIntro.t = setTimeout(function () { el.hidden = true; }, 2000);
  }

  function showTurnToast(text, delay) {
    const el = $('turnToast');
    clearTimeout(showTurnToast.t);
    showTurnToast.t = setTimeout(function () {
      el.textContent = text;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }, delay || 0);
  }

  /* Abandon : deux appuis (le premier demande confirmation). Contre l'ordi, abandonner fait perdre sa bille. */
  function resetQuit() {
    clearTimeout(resetQuit.t);
    $('quitBtn').classList.remove('confirm');
    $('quitText').hidden = true;
    $('quitText').textContent = '';
    $('hud').classList.remove('confirming');
  }
  $('quitBtn').addEventListener('click', function () {
    if (!game.active || game.phase === 'over') return;
    const btn = $('quitBtn');
    if (!btn.classList.contains('confirm')) {
      btn.classList.add('confirm');
      $('quitText').textContent = game.mode === 'bot' ? 'Confirmer : tu perds ta bille' : 'Confirmer : quitter';
      $('quitText').hidden = false;
      $('hud').classList.add('confirming');
      resetQuit.t = setTimeout(resetQuit, 3500);
      return;
    }
    resetQuit();
    if (game.mode === 'bot') {
      finish(1);
    } else {
      cancelMatch('Tu as quitté la partie. Personne ne perd sa bille.');
    }
  });

  function beginTurn() {
    game.shotCount = (game.shotCount || 0) + 1;
    const first = game.shotCount === 1;
    const toastDelay = Math.max(0, introUntil - performance.now());
    setTurnPill(game.turn === 0);
    if (game.turn === 0) {
      game.phase = 'aim';
      setStatus(first ? "Premier tir : place ta bille, tu ne peux pas encore tiquer. Glisse vers l'arrière puis relâche." : "Glisse vers l'arrière puis relâche. Ta main tremble un peu : choisis ton moment.");
      showTurnToast('À toi !', toastDelay);
    } else if (game.mode === 'bot') {
      game.phase = 'aim';
      setStatus(first ? "L'ordi place sa bille..." : "L'ordi vise...");
      showTurnToast("Tour de l'ordi", toastDelay);
      botTurn();
    } else {
      game.phase = 'remote';
      game.lastNetAt = Date.now();
      setStatus(game.oppName + ' tire...');
      showTurnToast('Tour de ' + game.oppName, toastDelay);
    }
  }

  function setTurnPill(mine) {
    $('turnPill').classList.toggle('mine', mine);
    $('turnText').textContent = mine ? 'À toi de tirer' : (game.mode === 'bot' ? "L'ordi" : game.oppName) + ' joue';
    $('hudMeCard').classList.toggle('turn', mine);
    $('hudOppCard').classList.toggle('turn', !mine);
  }

  function shoot(player, dir, power) {
    const b = marbles[player].body;
    const v = power * V_MAX;
    b.velocity.set(dir.x * v, 0, dir.z * v);
    b.angularVelocity.set((dir.z * v) / R, 0, (-dir.x * v) / R);
    game.phase = 'rolling';
    game.rollTime = 0;
    game.trackAcc = 0;
    setStatus('Les billes roulent...');
  }

  function botTurn() {
    botTimer = setTimeout(function () {
      if (!game.active || game.phase !== 'aim' || game.turn !== 1 || game.mode !== 'bot') return;
      const me = marbles[1].body.position;
      const you = marbles[0].body.position;
      const dx = you.x - me.x;
      const dz = you.z - me.z;
      /* Au premier tir l'ordi se place : il vise un point à mi-chemin, sans chercher à toucher. */
      const dist = Math.sqrt(dx * dx + dz * dz) * (game.shotCount === 1 ? 0.5 : 1);
      const angle = Math.atan2(dz, dx) + (Math.random() - 0.5) * (game.shotCount === 1 ? 0.6 : 0.22);
      let v;
      if (terrain === 'plate' || (terrain === 'terre' && potDepthAt(me.x, me.z) > 0)) {
        v = V_MAX * (0.65 + Math.random() * 0.35);
      } else {
        /* Distance d'arrêt avec décélération constante : d = v² / 2a, donc v = racine(2·a·d). */
        v = Math.min(Math.sqrt(2 * TERRAINS[terrain].roll * dist) * (1.05 + Math.random() * 0.25) + 0.3, V_MAX);
      }
      shoot(1, { x: Math.cos(angle), z: Math.sin(angle) }, v / V_MAX);
    }, 900 + Math.max(0, introUntil - performance.now()));
  }

  function onSettled() {
    marbles.forEach(function (m) {
      m.body.velocity.set(0, 0, 0);
      m.body.angularVelocity.set(0, 0, 0);
    });
    if (game.net && game.turn === 0) sendNet('settle', { p: netState() });
    game.turn = 1 - game.turn;
    beginTurn();
  }

  function finish(winner) {
    if (!game.active || game.phase === 'over') return;
    game.phase = 'over';
    clearTimeout(botTimer);
    $('turnPill').hidden = true;
    /* Petit ralenti au moment où les billes se touchent. */
    game.slowUntil = performance.now() + 900;
    setTimeout(winner === 0 ? playWin : playLose, 500);
    if (game.net && winner === 0) sendNet('result', { p: netState() });
    const prize = TICKETS_BY_RARITY[rarityOf(game.my)];
    const label = prize + (prize > 1 ? ' tickets' : ' ticket');
    if (winner === 0) {
      bag.tickets += prize;
      bag.marbles.push(Object.assign(pub(game.opp), { uid: randId(12) }));
      persist();
      showBanner('Tu gagnes sa bille et ' + label + ' !', CATALOG[game.opp.type].name + ' rejoint ton sac. Joue tes tickets dans la machine.', game.opp);
    } else {
      removeMarble(game.my.uid);
      persist();
      showBanner('Tu perds ta bille.', game.oppName + ' la prend et gagne ' + label + '.', game.my);
    }
    setStatus('');
    renderAll();
  }

  function cancelMatch(message) {
    if (!game.active || game.phase === 'over') return;
    game.phase = 'over';
    clearTimeout(botTimer);
    $('turnPill').hidden = true;
    showBanner('Partie annulée', message, null);
    setStatus('');
  }

  function endMatch() {
    if (game.net) {
      const room = game.net.room;
      game.net = null;
      room.leave().catch(function () {});
      setPresence('lobby');
    }
    game.active = false;
    game.phase = 'idle';
    game.targets = null;
    $('banner').hidden = true;
    showIdle();
    renderAll();
  }

  function showBanner(title, sub, def) {
    $('replayBtn').hidden = !(game.mode === 'bot' && game.phase === 'over' && game.active && getStake() && title.indexOf('annulée') < 0);
    $('bannerBtn').textContent = $('replayBtn').hidden ? 'Continuer' : 'Changer de bille';
    $('bannerTitle').textContent = title;
    $('bannerSub').textContent = sub;
    const holder = $('bannerThumb');
    holder.replaceChildren();
    if (def) holder.appendChild(thumbCanvas(def, 96));
    $('banner').hidden = false;
  }

  function showIdle() {
    const stake = getStake();
    if (stake) {
      setLook(0, stake);
      placeAt(0, { x: 0, z: 0 });
    } else {
      hideMarble(0);
    }
    hideMarble(1);
    setStatus('');
  }

  function startBotMatch() {
    const stake = getStake();
    if (!stake || game.active) return;
    const opp = makeDef(pick(typesOf(rarityOf(stake))));
    /* Le terrain est tiré au sort à chaque partie (les départs en dépendent, donc on le pose d'abord). */
    const where = pick(TERRAIN_LIST);
    setTerrain(where);
    startMatch({ mode: 'bot', my: stake, opp: opp, oppName: "L'ordi", terrain: where, spots: randomSpots(), starter: Math.random() < 0.5 ? 0 : 1 });
  }

  /* ================= Réseau : état des billes ================= */
  const round = (v) => Math.round(v * 10000) / 10000;

  function netOrder(arr) {
    return game.net && !game.net.isHost ? [arr[1], arr[0]] : arr;
  }

  function netState() {
    return netOrder(marbles.map(function (m) {
      const p = m.body.position;
      const q = m.body.quaternion;
      return [p.x, p.y, p.z, q.x, q.y, q.z, q.w].map(round);
    }));
  }

  function readState(arr) {
    if (!Array.isArray(arr) || arr.length !== 2) return null;
    const out = [];
    for (const e of arr) {
      if (!Array.isArray(e) || e.length !== 7 || !e.every((n) => typeof n === 'number' && isFinite(n))) return null;
      const q = new THREE.Quaternion(e[3], e[4], e[5], e[6]);
      if (q.length() < 0.5) q.set(0, 0, 0, 1);
      q.normalize();
      out.push({
        p: new THREE.Vector3(Math.max(-HALF, Math.min(HALF, e[0])), Math.max(-1, Math.min(3, e[1])), Math.max(-HALF, Math.min(HALF, e[2]))),
        q: q
      });
    }
    return netOrder(out);
  }

  function applyExact(state) {
    state.forEach(function (s, i) {
      const b = marbles[i].body;
      b.position.set(s.p.x, s.p.y, s.p.z);
      b.quaternion.set(s.q.x, s.q.y, s.q.z, s.q.w);
      b.velocity.set(0, 0, 0);
      b.angularVelocity.set(0, 0, 0);
      marbles[i].mesh.position.copy(s.p);
      marbles[i].mesh.quaternion.copy(s.q);
    });
    game.targets = null;
  }

  function sendNet(topic, data) {
    if (!game.net) return;
    data.gid = game.net.gid;
    game.net.room.emit(topic, data).catch(function () {});
  }

  function fromOpponent(msg) {
    return game.net && !msg.isMe && msg.peer === game.net.oppPeer && msg.data && msg.data.gid === game.net.gid;
  }

  function wireGameRoom(gr) {
    gr.on('track', function (msg) {
      if (!fromOpponent(msg) || game.phase !== 'remote') return;
      const s = readState(msg.data.p);
      if (!s) return;
      game.targets = s;
      game.lastNetAt = Date.now();
    });
    gr.on('settle', function (msg) {
      if (!fromOpponent(msg) || game.phase !== 'remote') return;
      const s = readState(msg.data.p);
      if (s) applyExact(s);
      game.turn = 0;
      beginTurn();
    });
    gr.on('result', function (msg) {
      if (!fromOpponent(msg) || game.phase !== 'remote') return;
      const s = readState(msg.data.p);
      if (s) applyExact(s);
      finish(1);
    });
  }

  /* ================= Réseau : salle et défis ================= */
  const net = { room: null, user: null, myPeer: null, peers: [], pending: null, incoming: null, canSend: true };

  function setPresence(st) {
    if (net.room) net.room.presence({ st: st }).catch(function () {});
  }

  async function connectRoom() {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') { lobbyUnavailable(); return; }
    const results = await Promise.all([C.use('room'), C.use('user')]);
    const room = results[0];
    net.user = results[1];
    if (!room) { lobbyUnavailable(); return; }
    net.room = room;
    room.onPeers(function (change) {
      net.peers = change.peers;
      const me = change.peers.find((p) => p.sameTab);
      if (me) net.myPeer = me.peer;
      renderLobby();
    }, function () { lobbyUnavailable(); });
    room.on('challenge', onChallenge);
    room.on('answer', onAnswer);
    setPresence('lobby');
  }

  function lobbyUnavailable() {
    net.room = null;
    $('lobbyNote').textContent = "Le jeu en ligne n'est pas disponible ici. Ouvre la page sur claude.ai, connecté à ton compte.";
    $('peerList').replaceChildren();
  }

  function challenge(peer) {
    const stake = getStake();
    if (!stake || game.active || net.pending || !net.room) return;
    const gid = randId(10);
    net.pending = { gid: gid, to: peer.peer, by: peer.by, stake: pub(stake) };
    net.room.emit('challenge', { to: peer.peer, gid: gid, marble: pub(stake) }).catch(function (e) {
      net.pending = null;
      if (e && e.code === 'not_permitted') net.canSend = false;
      renderLobby();
    });
    setTimeout(function () {
      if (net.pending && net.pending.gid === gid) {
        net.pending = null;
        setStatus('Pas de réponse à ton défi.');
        renderLobby();
      }
    }, 30000);
    renderLobby();
  }

  function onChallenge(msg) {
    const d = msg.data;
    if (msg.isMe || !d || d.to !== net.myPeer || typeof d.gid !== 'string' || !/^[a-z0-9]{6,16}$/.test(d.gid)) return;
    const marble = sanitizeDef(d.marble);
    if (!marble) return;
    if (game.active || net.incoming || net.pending) {
      net.room.emit('answer', { to: msg.peer, gid: d.gid, accept: false, busy: true }).catch(function () {});
      return;
    }
    net.incoming = { from: msg.peer, by: msg.by, gid: d.gid, marble: marble };
    showView('play');
    renderLobby();
  }

  function declineIncoming() {
    const inc = net.incoming;
    if (!inc) return;
    net.incoming = null;
    net.room.emit('answer', { to: inc.from, gid: inc.gid, accept: false }).catch(function () {});
    renderLobby();
  }

  async function acceptIncoming(def) {
    const inc = net.incoming;
    if (!inc || rarityOf(def) !== rarityOf(inc.marble)) return;
    net.incoming = null;
    renderLobby();
    try {
      const gr = await net.room.join('g-' + inc.gid);
      const name = await nameOf(inc.by);
      const waiting = { done: false };
      game.net = { room: gr, isHost: false, oppPeer: inc.from, gid: inc.gid };
      wireGameRoom(gr);
      gr.on('start', function (msg) {
        if (waiting.done || !fromOpponent(msg)) return;
        game.net = { room: gr, isHost: false, oppPeer: inc.from, gid: inc.gid };
        const s = readState(msg.data.p);
        if (!s) return;
        waiting.done = true;
        startMatch({
          mode: 'online', my: def, opp: inc.marble, oppName: name, terrain: (TERRAIN_LIST.includes(msg.data.terrain) ? msg.data.terrain : 'tarmac'),
          spots: s.map((e) => ({ x: e.p.x, z: e.p.z })), starter: msg.data.starter === 'guest' ? 0 : 1, net: game.net
        });
      });
      watchOpponent(gr, inc.from);
      await net.room.emit('answer', { to: inc.from, gid: inc.gid, accept: true, marble: pub(def) });
      setStatus('Défi accepté. La partie commence...');
      setTimeout(function () {
        if (!waiting.done) {
          gr.leave().catch(function () {});
          if (!game.active) game.net = null;
          setStatus("La partie n'a pas démarré.");
        }
      }, NET_TIMEOUT_MS);
    } catch (e) {
      game.net = null;
      setStatus("Impossible de rejoindre la partie.");
    }
  }

  async function onAnswer(msg) {
    const d = msg.data;
    const p = net.pending;
    if (msg.isMe || !d || d.to !== net.myPeer || !p || d.gid !== p.gid || msg.peer !== p.to) return;
    net.pending = null;
    const name = await nameOf(p.by);
    if (!d.accept) {
      setStatus(d.busy ? name + ' est déjà occupé.' : name + ' a refusé ton défi.');
      renderLobby();
      return;
    }
    const theirs = sanitizeDef(d.marble);
    const mine = bag.marbles.find((m) => m.uid === p.stake.uid);
    if (!theirs || !mine || rarityOf(theirs) !== rarityOf(mine)) { renderLobby(); return; }
    try {
      const gr = await net.room.join('g-' + p.gid);
      const netInfo = { room: gr, isHost: true, oppPeer: p.to, gid: p.gid };
      game.net = netInfo;
      wireGameRoom(gr);
      let started = false;
      gr.onPeers(function (change) {
        const here = change.peers.some((x) => x.peer === p.to);
        if (!started && here) {
          started = true;
          const spotsTerrain = pick(TERRAIN_LIST);
          setTerrain(spotsTerrain);
          const starter = Math.random() < 0.5 ? 0 : 1;
          startMatch({ mode: 'online', my: mine, opp: theirs, oppName: name, terrain: spotsTerrain, spots: randomSpots(), starter: starter, net: netInfo });
          sendNet('start', { terrain: spotsTerrain, starter: starter === 0 ? 'host' : 'guest', p: netState() });
        }
      });
      watchOpponent(gr, p.to);
      setTimeout(function () {
        if (!started) {
          gr.leave().catch(function () {});
          if (!game.active) game.net = null;
          setStatus("La partie n'a pas démarré.");
        }
      }, NET_TIMEOUT_MS);
    } catch (e) {
      game.net = null;
      setStatus('Impossible de lancer la partie.');
    }
  }

  function watchOpponent(gr, oppPeer) {
    gr.onPeers(function (change) {
      if (change.left.some((x) => x.peer === oppPeer) && game.active && game.net && game.net.room === gr) {
        cancelMatch("Ton adversaire est parti. Personne ne perd sa bille.");
      }
    });
  }

  async function nameOf(id) {
    if (!id || !net.user) return 'Un joueur';
    try {
      const ps = await net.user.profiles([id]);
      return (ps[id] && ps[id].name) || 'Un joueur';
    } catch (e) {
      return 'Un joueur';
    }
  }

  /* ================= Visée au doigt ================= */
  const ray = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ndc = new THREE.Vector2();
  let drag = null;

  const dots = [];
  for (let i = 0; i < 10; i++) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
    d.visible = false;
    scene.add(d);
    dots.push(d);
  }

  function groundPoint(ev) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const out = new THREE.Vector3();
    return ray.ray.intersectPlane(plane, out) ? out : null;
  }

  function pullFrom(start, p) {
    const dx = start.x - p.x;
    const dz = start.z - p.z;
    const len = Math.sqrt(dx * dx + dz * dz);
    if (len < 0.05) return { dir: { x: 1, z: 0 }, power: 0 };
    return { dir: { x: dx / len, z: dz / len }, power: Math.min(len / MAX_PULL, 1) };
  }

  function showAim(pull) {
    const p = marbles[0].body.position;
    const n = Math.max(1, Math.round(pull.power * 10));
    dots.forEach(function (dot, idx) {
      dot.visible = idx < n;
      if (dot.visible) dot.position.set(p.x + pull.dir.x * (0.7 + idx * 0.5), p.y - R + 0.08, p.z + pull.dir.z * (0.7 + idx * 0.5));
    });
  }

  const hideAim = () => dots.forEach((dot) => { dot.visible = false; });
  const canHumanShoot = () => game.active && game.phase === 'aim' && game.turn === 0 && performance.now() > introUntil;

  canvas.addEventListener('pointerdown', function (ev) {
    if (!canHumanShoot()) return;
    const p = groundPoint(ev);
    if (!p) return;
    drag = { id: ev.pointerId, start: p, pull: null };
    canvas.setPointerCapture(ev.pointerId);
  });
  /* La main tremble : la visée oscille, d'autant plus que le tir est fort. Il faut choisir le moment où on relâche.
     Au relâchement, une petite erreur cachée s'ajoute (le pouce qui glisse). */
  const tremorAngle = (power, t) => (0.02 + 0.1 * power * power) * (0.6 * Math.sin(t * 2.1) + 0.4 * Math.sin(t * 3.7 + 1.3));
  function aimedPull(pull, t) {
    const a = tremorAngle(pull.power, t);
    const c = Math.cos(a);
    const s = Math.sin(a);
    return { dir: { x: pull.dir.x * c - pull.dir.z * s, z: pull.dir.x * s + pull.dir.z * c }, power: pull.power };
  }
  function gaussian() {
    return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
  }
  /* Barre de force : visible quand c'est à toi, elle suit la longueur du geste. */
  let shownForce = -1;
  function updateAim(now) {
    if (drag && drag.pull) showAim(aimedPull(drag.pull, now / 1000));
    $('forceRow').classList.toggle('off', !canHumanShoot());
    const p = drag && drag.pull ? drag.pull.power : 0;
    const pct = Math.round(p * 100);
    if (pct === shownForce) return;
    shownForce = pct;
    const fill = $('forceFill');
    fill.style.width = pct + '%';
    /* Le dégradé reste calé sur toute la barre : il passe au rouge seulement près du maximum. */
    fill.style.backgroundSize = pct > 0 ? (10000 / pct) + '% 100%' : '';
    $('forceVal').textContent = pct + ' %';
    $('forceMeter').setAttribute('aria-valuenow', String(pct));
  }

  canvas.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    const p = groundPoint(ev);
    if (!p) return;
    drag.pull = pullFrom(drag.start, p);
  });
  function endDrag(ev, fire) {
    if (!drag || ev.pointerId !== drag.id) return;
    const pull = drag.pull;
    drag = null;
    hideAim();
    if (!fire || !pull || pull.power <= 0.06 || !canHumanShoot()) return;
    const aimed = aimedPull(pull, performance.now() / 1000);
    const slip = gaussian() * (0.008 + 0.025 * pull.power);
    const c = Math.cos(slip);
    const s = Math.sin(slip);
    const power = Math.min(1, pull.power * (1 + gaussian() * 0.04));
    playFlick(power);
    shoot(0, { x: aimed.dir.x * c - aimed.dir.z * s, z: aimed.dir.x * s + aimed.dir.z * c }, power);
  }
  canvas.addEventListener('pointerup', function (ev) { endDrag(ev, true); });
  canvas.addEventListener('pointercancel', function (ev) { endDrag(ev, false); });

  /* ================= Son ================= */
  /* Tous les sons sont synthétisés (aucun fichier) : choc verre contre verre, roulement selon le terrain,
     rebond sur le mur, cliquetis sur les lignes de la plaque, pichenette, petites mélodies de fin, machine à billes. */
  const sound = { ctx: null, on: true, master: null, white: null, brown: null, roll: [], lastTick: 0 };
  try { sound.on = localStorage.getItem('billes.sound') !== '0'; } catch (e) { /* stockage indisponible */ }

  function audio() {
    if (!sound.on) return null;
    if (!sound.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      const ac = new AC();
      sound.ctx = ac;
      sound.master = ac.createGain();
      sound.master.gain.value = 0.8;
      sound.master.connect(ac.destination);
      const len = ac.sampleRate * 2;
      sound.white = ac.createBuffer(1, len, ac.sampleRate);
      sound.brown = ac.createBuffer(1, len, ac.sampleRate);
      const w = sound.white.getChannelData(0);
      const b = sound.brown.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        w[i] = Math.random() * 2 - 1;
        last = (last + 0.02 * w[i]) / 1.02;
        b[i] = last * 3.5;
      }
      marbles.forEach(function () {
        const src = ac.createBufferSource();
        src.buffer = sound.brown;
        src.loop = true;
        const f = ac.createBiquadFilter();
        f.type = 'lowpass';
        const g = ac.createGain();
        g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(sound.master);
        src.start(0, Math.random());
        sound.roll.push({ f: f, g: g });
      });
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    return sound.ctx;
  }

  function tone(freq, vol, dur, type, delay) {
    const ac = audio();
    if (!ac || vol < 0.003) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sound.master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(vol, freq, q, dur, type) {
    const ac = audio();
    if (!ac || vol < 0.003) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource();
    s.buffer = sound.white;
    const f = ac.createBiquadFilter();
    f.type = type || 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sound.master);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  /* Verre contre verre : partiels aigus non harmoniques qui s'éteignent vite, plus un petit claquement. */
  function playClink(speed) {
    const v = Math.min(1, speed / 9) * 0.5;
    const base = 2500 + Math.random() * 900;
    [1, 2.32, 3.94].forEach(function (mul, i) { tone(base * mul, v / (1 + i * 1.6), 0.2 / (1 + i * 0.5)); });
    noise(v * 0.6, 5000, 1.2, 0.03);
  }
  const playThud = (speed) => { const v = Math.min(1, speed / 10) * 0.45; noise(v, 420, 0.8, 0.09, 'lowpass'); tone(150, v * 0.6, 0.08); };
  const playClack = (speed) => { const v = Math.min(1, speed / 8) * 0.25; tone(1750 + Math.random() * 200, v, 0.06, 'triangle'); noise(v * 0.5, 3200, 3, 0.03); };
  const playFlick = (power) => noise(0.12 + power * 0.25, 1600, 1.5, 0.05);
  const playTick = (rarity) => {
    const now = performance.now();
    if (now - sound.lastTick < 30) return;
    sound.lastTick = now;
    tone(3200 + Math.random() * 1400, 0.05, 0.03);
  };
  function playMelody(notes, type) {
    notes.forEach(function (n, i) { tone(n, 0.16, 0.35, type || 'triangle', i * 0.11); });
  }
  const playWin = () => playMelody([523, 659, 784, 1047]);
  const playLose = () => playMelody([392, 330, 262], 'sine');
  const playPrize = (rarity) => {
    const runs = { common: [880], uncommon: [880, 1175], rare: [880, 1175, 1480], legend: [880, 1175, 1480, 1760, 2349] };
    playMelody(runs[rarity] || [880], 'sine');
  };

  /* Roulement : bruit grave filtré selon le terrain, d'autant plus fort que la bille va vite. */
  const ROLL_SOUND = { tarmac: { freq: 900, q: 0.7, vol: 0.32 }, plate: { freq: 2300, q: 4, vol: 0.22 }, terre: { freq: 320, q: 0.5, vol: 0.3 } };
  function updateRollSound() {
    if (!sound.ctx || !sound.roll.length) return;
    const prof = ROLL_SOUND[terrain];
    const t = sound.ctx.currentTime;
    marbles.forEach(function (m, i) {
      const v = m.body.velocity;
      const moving = sound.on && m.mesh.visible && game.phase !== 'remote' && game.phase !== 'idle' && Math.abs(v.y) < 1.5;
      const speed = moving ? Math.hypot(v.x, v.z) : 0;
      sound.roll[i].f.frequency.setTargetAtTime(prof.freq * (0.8 + Math.min(speed, 12) / 30), t, 0.05);
      sound.roll[i].f.Q.value = prof.q;
      sound.roll[i].g.gain.setTargetAtTime(Math.min(1, speed / 12) * prof.vol, t, 0.05);
    });
  }

  /* Petite vibration du téléphone quand ça cogne (ignorée là où ce n'est pas disponible). */
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* non disponible */ }
  }

  document.addEventListener('pointerdown', function () { audio(); }, true);

  /* ================= Interface ================= */
  function setStatus(text) {
    $('status').textContent = text;
    $('homeStatus').textContent = game.active ? '' : text;
  }

  /* Les miniatures pas encore en cache sont rendues une par une, image après image : l'écran reste réactif. */
  const THUMB_BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const thumbQueue = [];
  function pumpThumbs() {
    const start = performance.now();
    while (thumbQueue.length && performance.now() - start < 12) {
      const job = thumbQueue.shift();
      if (!job.img.isConnected) continue;
      job.img.src = thumbUrl(job.def, job.px);
      job.img.classList.remove('thumb-pending');
    }
    if (thumbQueue.length) requestAnimationFrame(pumpThumbs);
  }
  function queueThumb(img, def, px) {
    if (!thumbQueue.length) requestAnimationFrame(pumpThumbs);
    thumbQueue.push({ img: img, def: def, px: px });
  }
  const thumbObserver = window.IntersectionObserver ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      thumbObserver.unobserve(e.target);
      queueThumb(e.target, e.target.__thumbDef, e.target.__thumbPx);
    });
  }, { rootMargin: '200px' }) : null;
  function thumbCanvas(def, size) {
    const img = document.createElement('img');
    img.width = img.height = size;
    img.alt = CATALOG[def.type].name;
    /* Les grandes images (accueil) sont rendues en haute définition. */
    const px = size > 150 ? HERO_PX : size > 100 ? THUMB_RT : 160;
    const cached = thumbCache.get(def.type + ':' + def.hue + ':' + def.seed + ':' + px);
    if (cached) {
      img.src = cached;
    } else {
      img.src = THUMB_BLANK;
      img.className = 'thumb-pending';
      /* Avec des centaines de billes, seules celles visibles à l'écran sont dessinées. */
      if (thumbObserver) {
        img.__thumbDef = def;
        img.__thumbPx = px;
        thumbObserver.observe(img);
      } else {
        queueThumb(img, def, px);
      }
    }
    return img;
  }


  function labelFor(def) {
    const wrap = document.createElement('span');
    wrap.className = 'stake-text';
    const name = document.createElement('span');
    name.className = 'card-name';
    name.textContent = CATALOG[def.type].name;
    const chip = document.createElement('span');
    chip.className = 'chip r-' + rarityOf(def);
    chip.textContent = RARITIES[rarityOf(def)].name;
    wrap.append(name, chip);
    return wrap;
  }

  function cardEl(def, onPick, pressed, size) {
    const el = document.createElement(onPick ? 'button' : 'div');
    el.className = 'card r-' + rarityOf(def);
    if (onPick) {
      el.type = 'button';
      el.setAttribute('aria-pressed', pressed ? 'true' : 'false');
      el.addEventListener('click', onPick);
    }
    el.append(thumbCanvas(def, size || 56), labelFor(def));
    return el;
  }

  const byRarity = (a, b) => RARITIES[rarityOf(b)].rank - RARITIES[rarityOf(a)].rank || a.type.localeCompare(b.type);

  /* Accueil : ta bille de jeu en grand, à faire défiler avec les flèches. Le terrain est tiré au sort au lancement. */
  const TERRAIN_NAMES = { tarmac: 'Goudron', plate: "Plaque d'égout", terre: 'Terre' };
  const TERRAIN_LIST = Object.keys(TERRAIN_NAMES);
  const sortedBag = () => bag.marbles.slice().sort(byRarity);

  function chooseStake(def) {
    if (game.active) return;
    bag.stakeUid = def.uid;
    persist();
    showIdle();
    renderAll();
  }

  function stepStake(delta) {
    const list = sortedBag();
    if (list.length < 2 || game.active) return;
    const i = Math.max(0, list.findIndex((m) => m.uid === bag.stakeUid));
    chooseStake(list[(i + delta + list.length) % list.length]);
    const el = $('heroMain');
    el.classList.remove('swap');
    void el.offsetWidth;
    el.classList.add('swap');
    tone(660 + delta * 80, 0.05, 0.06, 'triangle');
  }

  function fillHud() {
    const prize = TICKETS_BY_RARITY[rarityOf(game.my)];
    $('hudMe').replaceChildren(thumbCanvas(game.my, 38));
    $('hudOpp').replaceChildren(thumbCanvas(game.opp, 38));
    $('hudMeName').textContent = CATALOG[game.my.type].name;
    $('hudOppName').textContent = game.oppName;
    $('hudOppMarble').textContent = CATALOG[game.opp.type].name;
    $('hudStake').textContent = '+' + ticketsText(prize);
    $('hudTerrain').textContent = TERRAIN_NAMES[terrain];
    resetQuit();
  }

  let heroKey = '';
  function renderHome() {
    const wasInMatch = document.body.classList.contains('in-match');
    document.body.classList.toggle('in-match', game.active);
    $('hud').hidden = !game.active;
    if (game.active) {
      if (!wasInMatch) fillHud();
      return;
    }
    if (wasInMatch) window.scrollTo(0, 0);
    const list = sortedBag();
    if (!getStake() && list.length) bag.stakeUid = list[0].uid;
    const stake = getStake();
    const i = stake ? list.indexOf(stake) : -1;
    const many = list.length > 1;
    const prev = many && list.length > 2 ? list[(i - 1 + list.length) % list.length] : null;
    const next = many ? list[(i + 1) % list.length] : null;
    const key = [stake, prev, next].map((d) => (d ? d.uid : '-')).join('|');
    if (key !== heroKey) {
      heroKey = key;
      const mystery = document.createElement('span');
      mystery.className = 'mystery';
      mystery.textContent = '?';
      $('heroMain').replaceChildren(stake ? thumbCanvas(stake, 210) : mystery);
      $('heroPrev').replaceChildren(prev ? thumbCanvas(prev, 104) : '');
      $('heroNext').replaceChildren(next ? thumbCanvas(next, 104) : '');
    }
    $('prevBtn').hidden = $('nextBtn').hidden = !many;
    $('heroRarity').hidden = !stake;
    $('botBtn').hidden = !stake;
    $('toMachineBtn').hidden = !!stake;
    const risk = $('stakeRisk');
    risk.replaceChildren();
    if (!stake) {
      $('heroName').textContent = 'Sac vide';
      $('stakeNote').textContent = 'Lance des billes dans la machine pour en gagner.';
      return;
    }
    const r = rarityOf(stake);
    $('heroName').textContent = CATALOG[stake.type].name;
    $('heroRarity').textContent = RARITIES[r].name;
    $('heroRarity').className = 'rchip r-' + r;
    $('stakeNote').textContent = 'Ta bille de jeu · ' + (i + 1) + ' sur ' + list.length + ' dans ton sac';
    const b1 = document.createElement('b');
    b1.textContent = 'sa bille et ' + ticketsText(TICKETS_BY_RARITY[r]);
    const b2 = document.createElement('b');
    b2.textContent = 'ta bille';
    risk.append('Contre une bille ' + RARITIES[r].name.toLowerCase() + '. Gagne\u00a0: ', b1, '. Perds\u00a0: ', b2, '.');
  }

  /* Sac : filtre par rareté, choix de la bille de jeu, et défausse de 3 billes contre 1 ticket (autant de lots qu'on veut). */
  const DISCARD_COUNT = 3;
  const bagUi = { filter: 'all', discarding: false, picked: [] };

  function renderBagFilters() {
    const box = $('bagFilters');
    box.replaceChildren();
    const counts = { all: bag.marbles.length };
    bag.marbles.forEach(function (m) { counts[rarityOf(m)] = (counts[rarityOf(m)] || 0) + 1; });
    const labels = { all: 'Toutes', legend: 'Légendaires', rare: 'Rares', uncommon: 'Peu communes', common: 'Communes' };
    Object.keys(labels).forEach(function (id) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', bagUi.filter === id ? 'true' : 'false');
      b.dataset.r = id;
      b.textContent = labels[id];
      const n = document.createElement('span');
      n.className = 'num';
      n.textContent = counts[id] || 0;
      b.append(n);
      b.addEventListener('click', function () { bagUi.filter = id; renderBag(); });
      box.append(b);
    });
  }

  const visibleMarbles = () => bag.marbles
    .filter((m) => bagUi.filter === 'all' || rarityOf(m) === bagUi.filter)
    .sort(byRarity);

  function togglePick(uid) {
    const i = bagUi.picked.indexOf(uid);
    if (i >= 0) bagUi.picked.splice(i, 1); else bagUi.picked.push(uid);
    renderBag();
  }

  function renderBag() {
    if (game.active && bagUi.discarding) { bagUi.discarding = false; bagUi.picked = []; }
    bagUi.picked = bagUi.picked.filter((uid) => bag.marbles.some((m) => m.uid === uid));
    renderBagFilters();
    renderDiscardBar();
    /* Les miniatures ne sont fabriquées que quand le sac est affiché : le démarrage reste rapide. */
    if ($('view-bag').hidden) return;
    const grid = $('bagGrid');
    grid.classList.toggle('discard-mode', bagUi.discarding);
    grid.replaceChildren();
    const list = visibleMarbles();
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'note';
      p.textContent = bag.marbles.length ? 'Aucune bille de cette rareté.' : 'Ton sac est vide. Lance des billes dans la machine pour en gagner.';
      grid.append(p);
      return;
    }
    list.forEach(function (def) {
      const picked = bagUi.picked.includes(def.uid);
      const card = bagUi.discarding
        ? cardEl(def, function () { togglePick(def.uid); }, picked, 84)
        : cardEl(def, function () {
          if (game.active) return;
          showView('play');
          chooseStake(def);
        }, def.uid === bag.stakeUid, 84);
      if (def.uid === bag.stakeUid) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'En jeu';
        card.append(tag);
      }
      if (bagUi.discarding && picked) {
        const check = document.createElement('span');
        check.className = 'check';
        check.setAttribute('aria-hidden', 'true');
        check.textContent = '✓';
        card.append(check);
      }
      grid.append(card);
    });
  }

  function renderDiscardBar() {
    const n = bagUi.picked.length;
    const lots = Math.floor(n / DISCARD_COUNT);
    const missing = (DISCARD_COUNT - (n % DISCARD_COUNT)) % DISCARD_COUNT;
    const toggle = $('discardToggle');
    toggle.textContent = bagUi.discarding ? 'Terminer' : 'Défausser';
    toggle.disabled = game.active || (!bagUi.discarding && bag.marbles.length < DISCARD_COUNT);
    $('discardBar').hidden = !bagUi.discarding;
    if (!bagUi.discarding) {
      if (!bagUi.flash) $('bagHint').textContent = 'Touche une bille pour la jouer.';
      return;
    }
    if (!bagUi.flash) $('bagHint').textContent = 'Sélectionne les billes à défausser. Chaque lot de ' + DISCARD_COUNT + ' billes donne 1 ticket.';
    $('discardCount').textContent = n + (n > 1 ? ' billes sélectionnées' : ' bille sélectionnée');
    let gain;
    if (!n) gain = 'Touche des billes pour les sélectionner.';
    else if (!lots) gain = 'Encore ' + missing + ' pour 1 ticket.';
    else gain = 'Donne ' + ticketsText(lots) + (missing ? '. ' + (n % DISCARD_COUNT) + ' en trop resteront dans ton sac.' : '.');
    $('discardGain').textContent = gain;
    const confirm = $('discardConfirm');
    confirm.disabled = !lots;
    confirm.textContent = lots ? 'Défausser\u00a0: +' + ticketsText(lots) : 'Défausser';
    $('clearSelBtn').disabled = !n;
  }

  function selectAllVisible() {
    visibleMarbles().forEach(function (m) {
      if (m.uid !== bag.stakeUid && !bagUi.picked.includes(m.uid)) bagUi.picked.push(m.uid);
    });
    renderBag();
  }

  /* On défausse des lots complets : les billes choisies en dernier qui ne forment pas un lot restent sélectionnées. */
  function confirmDiscard() {
    const lots = Math.floor(bagUi.picked.length / DISCARD_COUNT);
    if (game.active || !lots) return;
    const gone = new Set(bagUi.picked.slice(0, lots * DISCARD_COUNT));
    bagUi.picked = bagUi.picked.slice(lots * DISCARD_COUNT);
    bag.marbles = bag.marbles.filter((m) => !gone.has(m.uid));
    if (gone.has(bag.stakeUid)) bag.stakeUid = null;
    bag.tickets += lots;
    persist();
    bagUi.flash = true;
    $('bagHint').textContent = gone.size + ' billes défaussées : +' + ticketsText(lots) + ' !';
    setTimeout(function () { bagUi.flash = false; renderDiscardBar(); }, 2500);
    renderAll();
    if (!game.active) showIdle();
  }

  const ticketsText = (n) => n + (n > 1 ? ' tickets' : ' ticket');

  function renderPack() {
    const wait = bag.nextPackAt - Date.now();
    const ready = wait <= 0;
    $('packDot').hidden = !ready;
    $('ticketCount').textContent = bag.tickets;
    $('ticketPill').setAttribute('aria-label', ticketsText(bag.tickets) + ', aller à la machine');
    $('claimBtn').disabled = !ready;
    const full = bag.marbles.length + plinko.balls.length >= BAG_MAX;
    $('dropBtn').disabled = bag.tickets < 1 || full;
    $('dropLabel').textContent = full ? 'Sac plein' : bag.tickets < 1 ? 'Plus de ticket' : 'Lancer une bille';
    /* Plus de ticket : on dit tout de suite comment en avoir. */
    const broke = bag.tickets < 1 && !full && !plinko.balls.length;
    $('noTickets').hidden = !broke;
    if (broke) {
      $('claimBtn2').hidden = !ready;
      $('noTicketsTitle').textContent = ready ? FREE_TICKETS + ' tickets gratuits t\'attendent' : 'Plus de ticket';
      $('noTicketsSub').textContent = ready ? 'Récupère-les pour relancer la machine.' : 'Gagne des duels, défausse des billes en trop, ou attends les tickets gratuits.';
    }
    $('ticketInfo').textContent = full
      ? 'Sac plein (' + BAG_MAX + '). Défausse des billes.'
      : 'Sac : ' + bag.marbles.length + '/' + BAG_MAX;
    $('gainsEmpty').hidden = $('packReveal').children.length > 0;
    $('freeTitle').textContent = ready ? FREE_TICKETS + ' tickets gratuits' : 'Tickets gratuits';
    const mins = Math.max(1, Math.ceil(wait / 60000));
    $('packInfo').textContent = ready ? 'À récupérer maintenant' : 'Les suivants dans ' + (mins >= 60 ? Math.floor(mins / 60) + ' h ' + String(mins % 60).padStart(2, '0') : mins + ' min');
    renderTitle();
  }

  function renderRates() {
    const box = $('rates');
    box.replaceChildren();
    /* Mesuré en simulant 8 000 lancers avec la même physique que la machine (répartition par case). */
    const odds = { common: 0.152, uncommon: 0.069, rare: 0.024, legend: 0.015 };
    [['Rien', 0.41], ['+1 ticket (remboursé)', 0.33]].forEach(function (o) {
      const row = document.createElement('span');
      row.textContent = o[0] + ' ≈ ' + Math.round(o[1] * 100) + ' %';
      box.append(row);
    });
    Object.keys(RARITIES).forEach(function (id) {
      const row = document.createElement('span');
      const chip = document.createElement('span');
      chip.className = 'chip r-' + id;
      chip.textContent = RARITIES[id].name + ' ';
      const pct = (odds[id] * 100).toFixed(1).replace('.', ',');
      row.append(chip, document.createTextNode('≈ ' + pct + ' % : ' + typesOf(id).map((t) => CATALOG[t].name).join(', ')));
      box.append(row);
    });
  }

  function claimTickets() {
    if (Date.now() < bag.nextPackAt) return;
    bag.tickets += FREE_TICKETS;
    bag.nextPackAt = Date.now() + PACK_INTERVAL;
    persist();
    renderAll();
  }

  async function renderLobby() {
    const list = $('peerList');
    const note = $('lobbyNote');
    renderIncoming();
    if (!net.room) return;
    const others = net.peers.filter((p) => p.kind === 'viewer' && !p.isMe);
    const ids = others.map((p) => p.by).filter(Boolean);
    let profiles = {};
    if (net.user && ids.length) {
      try { profiles = await net.user.profiles(ids); } catch (e) { profiles = {}; }
    }
    list.replaceChildren();
    if (!net.canSend) {
      note.textContent = "Ton niveau d'accès ne permet pas de jouer en ligne. Demande au propriétaire de te donner l'accès Contributeur.";
    } else if (!others.length) {
      note.textContent = "Personne d'autre n'a la page ouverte. Partage-la avec tes amis pour jouer contre eux.";
    } else {
      note.textContent = 'Défie un joueur connecté. Il devra jouer une bille de la même rareté que la tienne.';
    }
    const stake = getStake();
    others.forEach(function (p) {
      const li = document.createElement('li');
      li.className = 'peer';
      const prof = p.by && profiles[p.by];
      const img = document.createElement('img');
      img.alt = '';
      if (prof) img.src = prof.avatarUrl; else img.hidden = true;
      const name = document.createElement('span');
      name.className = 'peer-name';
      name.textContent = (prof && prof.name) || 'Un joueur';
      li.append(img, name);
      const busy = p.presence && p.presence.st === 'playing';
      if (net.pending && net.pending.to === p.peer) {
        const s = document.createElement('span');
        s.className = 'peer-state';
        s.textContent = 'En attente...';
        li.append(s);
      } else if (busy) {
        const s = document.createElement('span');
        s.className = 'peer-state';
        s.textContent = 'En partie';
        li.append(s);
      } else {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ghost';
        b.textContent = 'Défier';
        b.disabled = !stake || game.active || !!net.pending || !net.canSend;
        b.addEventListener('click', function () { challenge(p); });
        li.append(b);
      }
      list.append(li);
    });
  }

  async function renderIncoming() {
    const box = $('incoming');
    const inc = net.incoming;
    if (!inc) { box.hidden = true; box.replaceChildren(); return; }
    const name = await nameOf(inc.by);
    if (net.incoming !== inc) return;
    box.hidden = false;
    box.className = 'incoming';
    box.replaceChildren();
    const r = rarityOf(inc.marble);
    const head = document.createElement('div');
    head.className = 'row';
    const text = document.createElement('p');
    text.textContent = name + ' te défie avec une bille ' + RARITIES[r].name.toLowerCase() + '. Le gagnant remporte ' + ticketsText(TICKETS_BY_RARITY[r]) + ' :';
    head.append(text, thumbCanvas(inc.marble, 36), labelFor(inc.marble));
    box.append(head);
    const options = bag.marbles.filter((m) => rarityOf(m) === r);
    const hint = document.createElement('p');
    hint.className = 'note';
    hint.textContent = options.length
      ? 'Choisis ta bille ' + RARITIES[r].name.toLowerCase() + ' pour accepter :'
      : "Tu n'as pas de bille " + RARITIES[r].name.toLowerCase() + ' à jouer.';
    box.append(hint);
    const picks = document.createElement('div');
    picks.className = 'picks';
    options.forEach(function (def) {
      picks.append(cardEl(def, function () { acceptIncoming(def); }, false));
    });
    box.append(picks);
    const no = document.createElement('button');
    no.type = 'button';
    no.className = 'ghost';
    no.textContent = 'Refuser';
    no.addEventListener('click', declineIncoming);
    box.append(no);
  }

  function albumExample(entry, ownedList) {
    if (ownedList.length) return ownedList[0];
    const f = bag.found[entry.key];
    return { type: entry.type, hue: f[0], seed: f[1] };
  }

  function renderAlbum() {
    markSeen();
    const total = ALBUM.length;
    const found = ALBUM.filter((e) => bag.found[e.key]).length;
    $('albumCount').textContent = found + '/' + total;
    $('albumSummary').textContent = found === total
      ? 'Album complet : tu as trouvé les ' + total + ' coloris !'
      : found + ' coloris trouvés sur ' + total + '. Chaque type de bille existe en plusieurs couleurs ou styles : les cases en pointillés restent à trouver.';
    $('albumBar').style.width = Math.round((found / total) * 100) + '%';
    if ($('view-album').hidden) return;
    const owned = {};
    bag.marbles.forEach(function (m) { (owned[entryOf(m)] = owned[entryOf(m)] || []).push(m); });
    const box = $('albumGroups');
    box.replaceChildren();
    ['legend', 'rare', 'uncommon', 'common'].forEach(function (r) {
      const entries = ALBUM.filter((e) => CATALOG[e.type].rarity === r);
      const group = document.createElement('section');
      group.className = 'album-group';
      const h = document.createElement('h3');
      const title = document.createElement('span');
      title.className = 'chip r-' + r;
      title.textContent = RARITIES[r].name;
      const cnt = document.createElement('span');
      cnt.className = 'num';
      cnt.textContent = entries.filter((e) => bag.found[e.key]).length + '/' + entries.length;
      h.append(title, cnt);
      group.append(h);
      /* Les types à un seul coloris (or, argent, diamant) partagent une même carte. */
      const singles = typesOf(r).filter((t) => entries.filter((e) => e.type === t).length === 1);
      const blocks = typesOf(r).filter((t) => !singles.includes(t)).map((t) => ({ title: CATALOG[t].name, list: entries.filter((e) => e.type === t) }));
      if (singles.length) blocks.push({ title: 'Pièces uniques', list: entries.filter((e) => singles.includes(e.type)) });
      blocks.forEach(function (blk) {
        const list = blk.list;
        const card = document.createElement('div');
        card.className = 'album-type';
        const h4 = document.createElement('h4');
        const n = document.createElement('span');
        n.textContent = blk.title;
        const c = document.createElement('span');
        c.className = 'num';
        c.textContent = list.filter((e) => bag.found[e.key]).length + '/' + list.length;
        h4.append(n, c);
        const row = document.createElement('div');
        row.className = 'album-row';
        list.forEach(function (e) {
          const slot = document.createElement('div');
          const label = document.createElement('span');
          label.textContent = e.label;
          if (bag.found[e.key]) {
            const mine = owned[e.key] || [];
            slot.className = 'slot';
            const img = thumbCanvas(albumExample(e, mine), 48);
            img.alt = CATALOG[e.type].name + ' ' + e.label.toLowerCase();
            const x = document.createElement('span');
            x.className = 'owned';
            x.textContent = mine.length ? 'x' + mine.length : 'perdue';
            slot.append(img, label, x);
          } else {
            slot.className = 'slot locked';
            const q = document.createElement('span');
            q.className = 'mystery';
            q.textContent = '?';
            q.setAttribute('aria-hidden', 'true');
            slot.append(q, label);
          }
          row.append(slot);
        });
        card.append(h4, row);
        group.append(card);
      });
      box.append(group);
    });
  }

  const VIEW_TITLES = { play: 'Billes', bag: 'Mon sac', album: 'Album', pack: 'Machine' };
  let currentView = 'play';
  function renderTitle() {
    $('viewTitle').textContent = VIEW_TITLES[currentView];
    const subs = {
      bag: bag.marbles.length + (bag.marbles.length > 1 ? ' billes' : ' bille') + ' sur ' + BAG_MAX,
      album: $('albumCount').textContent + ' coloris trouvés',
      pack: 'Plus elle tombe sur le côté, plus elle est rare.'
    };
    $('viewSub').hidden = !subs[currentView];
    $('viewSub').textContent = subs[currentView] || '';
  }

  function renderAll() {
    renderAlbum();
    renderHome();
    renderBag();
    renderPack();
    renderLobby();
  }

  function showView(name) {
    const changed = name !== currentView;
    currentView = name;
    ['play', 'bag', 'album', 'pack'].forEach(function (v) { $('view-' + v).hidden = v !== name; });
    if (name === 'album') renderAlbum();
    if (name === 'bag') renderBag();
    const tab = name === 'album' ? 'bag' : name;
    document.querySelectorAll('.nav [data-view]').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.view === tab ? 'true' : 'false');
    });
    renderTitle();

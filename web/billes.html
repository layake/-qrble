  /* ================= Machine à billes ================= */
  /* Géométrie en unités d'espacement des clous : origine au clou central du haut, y vers le bas.
     Triangle de 12 rangées (3 clous en haut, 14 en bas) au-dessus de 13 cases. */
  const PL_ROWS = 12;
  const ROW_H = 0.9;
  const PL_SLOTS = PL_ROWS + 1;
  const PL_W = PL_SLOTS / 2;
  const PEG_R = 0.12;
  const BALL_R = 0.28;
  const PL_GRAVITY = 14;
  const PL_BOUNCE = 0.4;
  const PL_NUDGE = 0.7;
  /* Les murs renvoient fort vers l'intérieur : une bille ne peut pas glisser le long du bord jusqu'à la case légendaire. */
  const PL_WALL_BOUNCE = 0.75;
  const SLOT_TOP = (PL_ROWS - 1) * ROW_H + 0.55;
  const SLOT_FLOOR = SLOT_TOP + 1.0;
  /* Gain selon la distance au centre. Les cases du centre ne donnent pas de bille : on peut lâcher beaucoup de billes
     (c'est le plaisir de la machine) sans inonder la collection. */
  const SLOT_PRIZE = Array.from({ length: PL_SLOTS }, function (_, k) {
    const d = Math.abs(k - (PL_SLOTS - 1) / 2);
    return d === 0 || d === 2 ? 'none' : d === 1 ? 'ticket' : d === 3 ? 'common' : d === 4 ? 'uncommon' : d === 5 ? 'rare' : 'legend';
  });
  const SLOT_COLORS = { none: '#3a4048', ticket: '#c98a3a', common: '#9aa6b2', uncommon: '#4cc47e', rare: '#7fa2f2', legend: '#e6b445' };
  const SLOT_LABEL = { none: '0', ticket: '+1', common: 'C', uncommon: 'PC', rare: 'R', legend: 'L' };
  const plinko = { canvas: $('plinko'), w: 0, h: 0, S: 0, ox: 0, oy: 0, pegs: [], segs: [], rows: [], balls: [], flashes: {}, sprite: null, refreshTimer: null };

  /* Les murs invisibles passent par le centre des clous extérieurs : la bille ne peut ni sortir du triangle ni glisser le long du bord. */
  (function buildPlinko() {
    for (let i = 0; i < PL_ROWS; i++) {
      plinko.rows.push([]);
      for (let j = 0; j < i + 3; j++) {
        const peg = { x: j - (i + 2) / 2, y: i * ROW_H };
        plinko.pegs.push(peg);
        plinko.rows[i].push(peg);
      }
    }
    const lastY = (PL_ROWS - 1) * ROW_H;
    [-1, 1].forEach(function (side) {
      plinko.segs.push([side, -1.8, side, 0]);
      plinko.segs.push([side, 0, side * PL_W, lastY]);
      plinko.segs.push([side * PL_W, lastY, side * PL_W, SLOT_FLOOR]);
    });
    for (let k = 1; k < PL_SLOTS; k++) plinko.segs.push([k - PL_W, SLOT_TOP, k - PL_W, SLOT_FLOOR]);
    plinko.segs.push([-PL_W, SLOT_FLOOR, PL_W, SLOT_FLOOR]);
  })();

  function layoutPlinko() {
    const c = plinko.canvas;
    const w = c.clientWidth;
    const h = c.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    const units = 1.9 + SLOT_FLOOR + 0.2;
    const S = Math.min((w - 16) / (PL_W * 2 + 0.6), (h - 16) / units);
    plinko.w = w;
    plinko.h = h;
    plinko.S = S;
    plinko.ox = w / 2;
    plinko.oy = (h - S * units) / 2 + S * 1.9;
    /* La bille est dessinée une fois dans une petite image, puis recopiée : bien plus rapide qu'un dégradé par bille et par image. */
    const size = Math.ceil(BALL_R * S * 2 * dpr) + 2;
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = size;
    const sg = sprite.getContext('2d');
    const c0 = size / 2;
    const gr = sg.createRadialGradient(c0 - size * 0.16, c0 - size * 0.16, size * 0.04, c0, c0, size / 2 - 1);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.6, '#cfd8e3');
    gr.addColorStop(1, '#7d8a99');
    sg.fillStyle = gr;
    sg.beginPath();
    sg.arc(c0, c0, size / 2 - 1, 0, Math.PI * 2);
    sg.fill();
    plinko.sprite = sprite;
  }

  function bounceOff(b, nx, ny, nudge, bounce) {
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const e = bounce === undefined ? PL_BOUNCE : bounce;
    b.vx -= (1 + e) * vn * nx;
    b.vy -= (1 + e) * vn * ny;
    b.vx *= 0.98;
    if (nudge) b.vx += (Math.random() - 0.5) * PL_NUDGE;
  }

  function collideCircle(b, x, y, r, nudge, bounce) {
    const dx = b.x - x;
    const dy = b.y - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    const min = BALL_R + r;
    if (d >= min || d === 0) return;
    const nx = dx / d;
    const ny = dy / d;
    b.x = x + nx * min;
    b.y = y + ny * min;
    if (nudge && b.vx * nx + b.vy * ny < -1.5) playTick();
    bounceOff(b, nx, ny, nudge, bounce);
  }

  function collideSegment(b, s) {
    const ex = s[2] - s[0];
    const ey = s[3] - s[1];
    const t = Math.max(0, Math.min(1, ((b.x - s[0]) * ex + (b.y - s[1]) * ey) / (ex * ex + ey * ey)));
    collideCircle(b, s[0] + ex * t, s[1] + ey * t, 0.02, false, PL_WALL_BOUNCE);
  }

  function dropBall() {
    if (bag.tickets < 1 || bag.marbles.length + plinko.balls.length >= BAG_MAX) return;
    bag.tickets -= 1;
    persist();
    plinko.balls.push({ x: (Math.random() - 0.5) * 0.5, y: -1.3, vx: 0, vy: 0, settle: 0 });
    renderPack();
  }

  function landBall(b) {
    const k = Math.max(0, Math.min(PL_SLOTS - 1, Math.floor(b.x + PL_W)));
    const prize = SLOT_PRIZE[k];
    plinko.balls.splice(plinko.balls.indexOf(b), 1);
    plinko.flashes[k] = 1.4;
    if (prize === 'none') {
      tone(220, 0.08, 0.15, 'sine');
      scheduleRefresh();
      return;
    }
    if (prize === 'ticket') {
      bag.tickets += 1;
      tone(1320, 0.1, 0.12, 'triangle');
      scheduleRefresh();
      return;
    }
    const def = makeDef(pick(typesOf(prize)));
    bag.marbles.push(def);
    if (!getStake()) bag.stakeUid = def.uid;
    playPrize(prize);
    const reveal = $('packReveal');
    reveal.prepend(cardEl(def, null, false, 46));
    while (reveal.children.length > 4) reveal.lastChild.remove();
    scheduleRefresh();
  }

  /* Quand beaucoup de billes tombent, on enregistre et on redessine le sac une seule fois par rafale. */
  function scheduleRefresh() {
    if (plinko.refreshTimer) return;
    plinko.refreshTimer = setTimeout(function () {
      plinko.refreshTimer = null;
      persist();
      renderAll();
      if (!game.active) showIdle();
    }, 400);
  }

  /* Les billes se traversent : si elles se cognaient, lancer en rafale les pousserait vers les bords et donnerait plus de légendaires. */
  function stepBalls(dt) {
    const balls = plinko.balls;
    const h = dt / 4;
    for (let s = 0; s < 4; s++) {
      balls.forEach(function (b) {
        b.vy += PL_GRAVITY * h;
        b.x += b.vx * h;
        b.y += b.vy * h;
        const row = Math.round(b.y / ROW_H);
        for (let r = Math.max(0, row - 1); r <= Math.min(PL_ROWS - 1, row + 1); r++) {
          plinko.rows[r].forEach(function (p) { collideCircle(b, p.x, p.y, PEG_R, true); });
        }
      });
      balls.forEach(function (b) { plinko.segs.forEach(function (seg) { collideSegment(b, seg); }); });
    }
    /* La bille disparaît dès qu'elle touche une case du bas. */
    balls.slice().forEach(function (b) {
      if (b.y + BALL_R >= SLOT_TOP + 0.08) landBall(b);
    });
  }

  function withAlpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function drawPlinko() {
    const S = plinko.S;
    if (!S) return;
    const g = plinko.canvas.getContext('2d');
    const X = (x) => plinko.ox + x * S;
    const Y = (y) => plinko.oy + y * S;
    g.clearRect(0, 0, plinko.w, plinko.h);
    g.textAlign = 'center';
    g.font = '700 ' + Math.max(10, Math.round(S * 0.34)) + 'px Figtree, system-ui, sans-serif';
    SLOT_PRIZE.forEach(function (r, k) {
      const lit = plinko.flashes[k] > 0;
      const x = X(k - PL_W + 0.07);
      const y = Y(SLOT_TOP + 0.08);
      const w = S * 0.86;
      const h = S * 0.78;
      const rad = S * 0.12;
      g.beginPath();
      g.moveTo(x + rad, y);
      g.arcTo(x + w, y, x + w, y + h, rad);
      g.arcTo(x + w, y + h, x, y + h, rad);
      g.arcTo(x, y + h, x, y, rad);
      g.arcTo(x, y, x + w, y, rad);
      g.closePath();
      g.fillStyle = lit ? '#ffffff' : SLOT_COLORS[r];
      g.fill();
      g.fillStyle = r === 'none' && !lit ? '#9aa6b2' : '#14181d';
      g.fillText(SLOT_LABEL[r], x + w / 2, y + h * 0.66);
    });
    g.fillStyle = '#eef1f4';
    plinko.pegs.forEach(function (p) {
      g.beginPath();
      g.arc(X(p.x), Y(p.y), PEG_R * S, 0, Math.PI * 2);
      g.fill();
    });
    const d = BALL_R * S * 2;
    plinko.balls.forEach(function (b) {
      g.drawImage(plinko.sprite, X(b.x) - d / 2, Y(b.y) - d / 2, d, d);
    });
  }

  function updatePlinko(dt) {
    if (plinko.balls.length) stepBalls(dt);
    Object.keys(plinko.flashes).forEach(function (k) {
      plinko.flashes[k] -= dt;
      if (plinko.flashes[k] <= 0) delete plinko.flashes[k];
    });
    drawPlinko();
  }

  /* ================= Tutoriel ================= */

  const tutoState = { i: 0, back: null };

  /* ================= Boucle ================= */
  function physicsStep() {
    if (game.phase === 'idle' || game.phase === 'remote') return;
    world.step(STEP);
    marbles.forEach(keepInside);
    marbles.forEach(terrainEffects);
    if (game.phase !== 'rolling') return;
    game.rollTime += STEP;
    if (game.net && game.turn === 0) {
      game.trackAcc += STEP;
      if (game.trackAcc >= TRACK_EVERY) {
        game.trackAcc = 0;
        sendNet('track', { p: netState() });
      }
    }
    if ((game.rollTime > 0.4 && allStill()) || game.rollTime > 14) onSettled();
  }

  function resize() {
    const w = stageEl.clientWidth;
    const h = stageEl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    updateCamera(true);
  }

  /* Caméra qui cadre les billes de près : elle suit leur milieu et recule quand elles s'éloignent. */
  const camTarget = new THREE.Vector3();
  const camPos = new THREE.Vector3(0, 18, 8);
  const camCenter = new THREE.Vector3();
  const camDesired = new THREE.Vector3();
  /* En partie, la caméra se place derrière ta bille, dans l'axe vers l'adversaire (comme au billard) :
     sur un téléphone en hauteur, les deux billes tiennent dans la longueur de l'écran. */
  const camAxis = new THREE.Vector3(0, 0, 1);
  const camAxisWanted = new THREE.Vector3();
  function updateCamera(snap) {
    const shown = marbles.filter((m) => m.mesh.visible);
    camCenter.set(0, 0, 0);
    shown.forEach(function (m) { camCenter.add(m.mesh.position); });
    if (shown.length) camCenter.divideScalar(shown.length);
    camCenter.y = 0;
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    let along = 3.2;
    if (game.active && shown.length === 2) {
      const me = marbles[0].mesh.position;
      const opp = marbles[1].mesh.position;
      camAxisWanted.set(me.x - opp.x, 0, me.z - opp.z);
      along = camAxisWanted.length() + 2.6;
      if (camAxisWanted.lengthSq() > 0.01) camAxisWanted.normalize(); else camAxisWanted.copy(camAxis);
    } else {
      camAxisWanted.set(0, 0, 1);
      if (shown.length === 2) along = shown[0].mesh.position.distanceTo(shown[1].mesh.position) + 2.6;
    }
    camAxis.lerp(camAxisWanted, snap ? 1 : 0.04).normalize();
    /* On vise un peu de ton côté : ta bille reste au-dessus du message en bas de l'écran. */
    if (game.active) camCenter.addScaledVector(camAxis, along * 0.12);
    /* Distance : la longueur entre les billes doit tenir en hauteur (vue inclinée), la largeur d'une marge en largeur. */
    const fitV = (along * 1.05) / (2 * tanV);
    const fitH = 3.4 / (2 * tanV * camera.aspect);
    const d = Math.min(Math.max(fitV, fitH, 4) * 1.12, 34);
    camDesired.set(camCenter.x + camAxis.x * d * 0.6, d * 0.8, camCenter.z + camAxis.z * d * 0.6);
    const k = snap ? 1 : 0.05;
    camPos.lerp(camDesired, k);
    camTarget.lerp(camCenter, k);
    camera.position.copy(camPos);
    camera.lookAt(camTarget);
  }
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(stageEl);
    new ResizeObserver(layoutPlinko).observe($('machine'));
  }
  window.addEventListener('resize', resize);

  const tmpTarget = new THREE.Vector3();
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    acc += dt * (performance.now() < (game.slowUntil || 0) ? 0.25 : 1);
    last = now;
    let steps = 0;
    while (acc >= STEP && steps < 12) {
      physicsStep();
      acc -= STEP;
      steps++;
    }
    if (game.phase === 'remote') {
      if (game.targets) {
        marbles.forEach(function (m, i) {
          const tp = game.targets[i].p;
          m.mesh.position.lerp(tmpTarget.set(tp.x, tp.y - (terrain === 'terre' ? potDepthAt(tp.x, tp.z) : 0), tp.z), 0.35);
          m.mesh.quaternion.slerp(game.targets[i].q, 0.35);
        });
      }
      if (Date.now() - game.lastNetAt > NET_TIMEOUT_MS) cancelMatch('La connexion avec ton adversaire est perdue. Personne ne perd sa bille.');
    } else {
      marbles.forEach(function (m) {
        m.mesh.position.copy(m.body.position);
        if (terrain === 'terre') m.mesh.position.y -= potDepthAt(m.mesh.position.x, m.mesh.position.z);
        m.mesh.quaternion.copy(m.body.quaternion);
      });
    }
    if (game.active) {
      updateCamera(false);
      updateAim(now);
      updateRollSound();
      placeShadows();
      renderer.render(scene, camera);
    }
    if (plinko.balls.length || !$('view-pack').hidden) updatePlinko(dt);
    requestAnimationFrame(frame);
  }

  /* Le sac enregistré sur le compte remplace la copie locale dès qu'il arrive. */
  async function connectDb() {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') return;
    try {
      const results = await Promise.all([C.use('db'), C.use('user')]);
      const db = results[0];
      const user = results[1];
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/bag');
      const snap = await ref.get();
      bagDoc = ref;
      const remote = snap.exists ? sanitizeBag(snap.data()) : null;
      if (remote) {
        bag = remote;
        saveLocal();
        if (!game.active) showIdle();
        renderAll();
      } else {
        persist();
      }
    } catch (e) {
      bagDoc = null;
    }
  }

  setTerrain('tarmac');
  renderRates();
  resize();
  /* La première bille compile le programme 3D (lourd) : on affiche d'abord la page et le message de chargement,
     puis on prépare les billes. */
  requestAnimationFrame(function () {
    setTimeout(function () {
      thumbUrl({ type: 'cateye', hue: 0, seed: 1 });
      showIdle();
      renderAll();
      $('loading').hidden = true;
      let seenTuto = false;
      try { seenTuto = localStorage.getItem(TUTO_KEY) === '1'; } catch (e) { seenTuto = false; }
      if (!seenTuto) openTuto();
      requestAnimationFrame(frame);
      connectDb();
      connectRoom();
    }, 30);
  });
  setInterval(renderPack, 1000);
})();
</script>

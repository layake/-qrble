<title>Billes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Mise en page : écran d'accueil avec ta bille en 3D, barre de navigation en bas (Sac, Accueil, Machine), partie en plein écran.
     Un seul thème sombre, celui de la maquette : bitume, craie, rouge brique et jaune ticket. */
  :root {
    --bg: #12161d;
    --ink: #f2efe6;
    --muted: #a9b0ba;
    --panel: #1d232d;
    --panel2: #262c37;
    --line: #2e3542;
    --accent: #e5553f;
    --accent-dark: #9c3426;
    --gold: #f0c14b;
    --gold-dark: #a5822a;
    --stage: #12161d;
    --focus: #7fa2f2;
    --r-common: #a9b0ba;
    --r-uncommon: #6fd39a;
    --r-rare: #8fb0ff;
    --r-legend: #e6b445;
    --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 500 16px/1.45 var(--font-body);
    margin: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 100vh;
    padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  h1 { font: 400 30px/1 var(--font-display); margin: 0; letter-spacing: 0.01em; }
  h2 { font: 400 1.3rem/1.1 var(--font-display); margin: 0; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg { flex: none; }

  /* En-tête commun : titre de l'écran, tickets (mène à la machine), aide, son. */
  .top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 4px; }
  .top-title { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .top-sub { font-size: 13px; color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 999px; border: 0;
    background: var(--panel); font-weight: 800; font-size: 15px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .icon-btn {
    width: 44px; height: 44px; flex: none; border-radius: 12px; border: 0; background: var(--panel);
    display: grid; place-items: center; padding: 0; cursor: pointer; font-weight: 800; font-size: 17px;
  }
  .view { display: grid; gap: 12px; padding: 0 16px; align-content: start; }
  #view-play { padding: 0; }

  /* Barre de navigation en bas. */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #0d1015; border-top: 1px solid var(--panel2);
    padding: 8px max(12px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  .nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .nav button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border: 0; border-radius: 14px;
    background: transparent; color: var(--muted); font-weight: 700; font-size: 12px; cursor: pointer; min-height: 56px;
  }
  .nav button[aria-current="true"] { color: #fff; font-weight: 800; background: var(--panel); box-shadow: inset 0 3px 0 var(--accent); }
  .nav .dot { position: absolute; top: 6px; right: calc(50% - 20px); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .num { font-variant-numeric: tabular-nums; color: inherit; opacity: 0.75; }

  /* Accueil : ta bille en grand sur le bitume, dans un cercle tracé à la craie. */
  /* La hauteur du décor s'adapte à l'écran : sur un petit téléphone, le bouton JOUER reste visible sans défiler. */
  .hero {
    --hh: clamp(180px, calc(100vh - 400px), 360px);
    --ms: min(220px, calc(var(--hh) * 0.56));
    position: relative; height: var(--hh); overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, #3a3f47 0 1.5px, transparent 2.5px) 0 0 / 14px 14px,
      radial-gradient(circle at 70% 60%, #2a2e35 0 2px, transparent 3px) 0 0 / 11px 11px,
      radial-gradient(ellipse at 50% 55%, #2b3039, #161a20 72%);
  }
  @supports (height: 100svh) { .hero { --hh: clamp(180px, calc(100svh - 400px), 360px); } }
  .chalk { position: absolute; left: 50%; top: 49%; width: min(320px, 82%); height: calc(var(--ms) * 0.67); transform: translate(-50%, -50%); border: 3px dashed rgba(242, 239, 230, 0.42); border-radius: 50%; }
  .hero-main { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: var(--ms); height: var(--ms); }
  .hero-main img, .hero-side img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 22px 18px rgba(0, 0, 0, 0.55)); }
  .hero-main .mystery { width: 100%; height: 100%; font-size: 4rem; }
  .hero-main.swap { animation: heroin 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  @keyframes heroin { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .hero-shadow { position: absolute; left: 50%; top: calc(46% + var(--ms) * 0.5 - 10px); width: calc(var(--ms) * 0.7); height: 20px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55), transparent 70%); }
  .hero-side { position: absolute; top: 46%; width: calc(var(--ms) * 0.5); height: calc(var(--ms) * 0.5); transform: translateY(-50%); opacity: 0.55; pointer-events: none; }
  .hero-side.left { left: calc(var(--ms) * -0.15); }
  .hero-side.right { right: calc(var(--ms) * -0.15); }
  .arrow {
    position: absolute; top: 46%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(18, 22, 29, 0.7); display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 2;
  }
  .arrow.left { left: 12px; }
  .arrow.right { right: 12px; }
  .hero-label { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; justify-items: center; gap: 6px; text-align: center; }
  .hero-name { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; font: 400 24px/1.1 var(--font-display); }
  .rchip { font: 800 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--line); color: var(--r-common); }
  .rchip.r-uncommon { color: var(--r-uncommon); }
  .rchip.r-rare { color: var(--r-rare); background: #1f2a44; }
  .rchip.r-legend { color: var(--r-legend); background: #3a2f14; }
  .hero-sub { font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .hero-main.swap { animation: none; } }

  .home-body { display: grid; gap: 12px; padding: 0 16px; }
  .home-status:empty { display: none; }
  .home-status { font-weight: 700; text-align: center; }
  .free { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--panel); }
  .free-text { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .free-text strong { font-size: 14px; font-weight: 800; }
  .free-text span { font-size: 12px; color: var(--muted); }
  .gold-btn {
    height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--gold); color: #1b1608;
    font: 800 14px var(--font-body); cursor: pointer;
  }
  .gold-btn:disabled { background: var(--panel2); color: var(--muted); cursor: not-allowed; }
  .risk { font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; }
  .risk b { color: var(--ink); }
  .play-btn {
    height: 68px; border-radius: 20px; border: 0; background: var(--accent); color: #fff; cursor: pointer; margin-top: 4px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 6px 0 var(--accent-dark), 0 14px 24px rgba(0, 0, 0, 0.35); transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .play-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark), 0 8px 16px rgba(0, 0, 0, 0.35); }
  .play-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .play-txt { display: grid; justify-items: center; gap: 4px; }
  .play-main { font: 400 32px/1 var(--font-display); letter-spacing: 0.02em; }
  .play-sub { font: 700 11px/1 var(--font-body); opacity: 0.9; }
  .online { background: var(--panel); border-radius: 18px; padding: 0 14px; }
  .online summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; font-weight: 800; font-size: 14px; }
  .online summary::-webkit-details-marker { display: none; }
  .online summary::after { content: '+'; font-size: 20px; color: var(--muted); }
  .online[open] summary::after { content: '−'; }
  .online-body { display: grid; gap: 10px; padding-bottom: 14px; }

  .primary {
    font: 700 15px/1 var(--font-body); color: #fff; background: var(--accent);
    border: 0; border-radius: 12px; padding: 13px 18px; min-height: 44px; cursor: pointer;
  }
  .primary:disabled, .ghost:disabled { opacity: 0.45; cursor: not-allowed; }
  .ghost {
    font: 700 14px/1 var(--font-body); background: transparent; border: 1.5px solid #3a414d;
    border-radius: 12px; padding: 11px 14px; min-height: 44px; cursor: pointer;
  }
  .panel { background: var(--panel); border-radius: 18px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
  .label { color: var(--ink); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
  .note { color: var(--muted); font-size: 0.92rem; max-width: 65ch; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }

  .peers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .peer { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .peer img { width: 32px; height: 32px; border-radius: 50%; flex: none; }
  .peer-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .peer-state { color: var(--muted); font-size: 0.85rem; }
  .incoming { margin: 0 16px; border: 2px solid var(--accent); border-radius: 16px; padding: 12px; display: grid; gap: 10px; background: var(--panel); }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .picks .card { width: 104px; }
  .stake-text { display: grid; min-width: 0; }

  /* Cartes de billes (sac, album, gains). */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 10px; text-align: center;
    background: var(--panel); border: 1.5px solid var(--panel2); border-radius: 16px; cursor: pointer; min-width: 0;
  }
  div.card { cursor: default; }
  .card img { filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.5)); margin-bottom: auto; }
  .card.r-uncommon { border-color: #2a3a33; }
  .card.r-rare { background: #1a2030; border-color: #2c3d63; }
  .card.r-legend { background: #211d14; border-color: #8a6a1e; }
  .card[aria-pressed="true"] { border: 2px solid var(--accent); }
  .card-name { font-weight: 700; font-size: 13px; line-height: 1.15; overflow-wrap: anywhere; }
  .chip { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  .chip.r-common { color: var(--r-common); }
  .chip.r-uncommon { color: var(--r-uncommon); }
  .chip.r-rare { color: var(--r-rare); }
  .chip.r-legend { color: var(--r-legend); }
  .card .tag {
    position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; background: var(--accent); color: #fff; border-radius: 6px; padding: 3px 7px;
  }
  .card .check {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center;
  }
  .thumb-pending { border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--panel2), var(--bg)); }
  .mystery { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font: 400 1.5rem var(--font-display); color: var(--muted); background: radial-gradient(circle at 35% 30%, var(--panel2), var(--bg)); }

  .bag-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    flex: none; font: 700 13px/1 var(--font-body); padding: 0 14px; height: 36px; border-radius: 999px;
    border: 1.5px solid #3a414d; background: transparent; cursor: pointer;
  }
  .chips button[data-r="legend"] { color: var(--r-legend); }
  .chips button[data-r="rare"] { color: var(--r-rare); }
  .chips button[data-r="uncommon"] { color: var(--r-uncommon); }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 800; }
  .chips .num { margin-left: 4px; }
  .discard-mode .card[aria-pressed="false"] { opacity: 0.75; }
  .discard-bar {
    position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px;
    display: grid; gap: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .discard-info { display: grid; gap: 2px; min-width: 0; }
  .discard-info strong { font-variant-numeric: tabular-nums; }
  .discard-info .note { font-size: 13px; }
  .discard-actions { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; }
  .discard-actions button { min-width: 0; padding-left: 12px; padding-right: 12px; line-height: 1.15; }

  /* Album : une case par coloris, rangées par type de bille. */
  .album-head { display: grid; gap: 8px; }
  .progress { height: 10px; border-radius: 999px; background: var(--panel2); overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }
  .album-group { display: grid; gap: 12px; margin-top: 14px; }
  .album-group > h3 { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font: 800 13px/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; }
  .album-type { display: grid; gap: 8px; background: var(--panel); border-radius: 16px; padding: 10px 12px 12px; }
  .album-type h4 { margin: 0; display: flex; justify-content: space-between; gap: 8px; font: 400 1rem/1.2 var(--font-display); }
  .album-type h4 .num { font: 700 12px var(--font-body); color: var(--muted); opacity: 1; }
  .album-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .slot { display: grid; justify-items: center; gap: 2px; text-align: center; min-width: 0; padding: 6px 2px; border-radius: 12px; background: var(--panel2); }
  .slot img { display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.45)); }
  .slot span { font-size: 11px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .slot.locked { background: transparent; border: 1.5px dashed var(--line); }
  .slot.locked span { color: var(--muted); font-weight: 600; }
  .slot.locked .mystery { width: 44px; height: 44px; font-size: 1.1rem; }
  .slot .owned { font-size: 10px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }

  /* Machine. */
  .machine { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 52vh; margin: 0 auto; border-radius: 22px; overflow: hidden; border: 1.5px solid var(--panel2); background: radial-gradient(ellipse at 50% 20%, #232a35, #151a21 75%); }
  .machine canvas { display: block; width: 100%; height: 100%; }
  .drop-btn {
    height: 64px; border-radius: 20px; border: 0; background: var(--gold); color: #1b1608; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 0 var(--gold-dark), 0 14px 24px rgba(0, 0, 0, 0.35); transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .drop-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-dark), 0 8px 16px rgba(0, 0, 0, 0.35); }
  .drop-btn:disabled { background: var(--panel2); color: var(--muted); box-shadow: none; cursor: not-allowed; }
  .drop-btn:disabled .drop-cost { display: none; }
  .no-tickets { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--panel); border: 1.5px solid var(--gold-dark); }
  .no-tickets .free-text { flex: 1; }
  .drop-main { font: 400 24px/1 var(--font-display); }
  .drop-cost { font: 800 13px var(--font-body); padding: 5px 9px; border-radius: 999px; background: rgba(27, 22, 8, 0.15); }
  .gains-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .gains-head span:last-child { font-size: 12px; color: var(--muted); text-align: right; }
  .gains { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .gains .card { background: var(--panel2); padding: 8px 4px; border-radius: 12px; }
  .gains .card .chip { display: none; }
  .gains .card-name { font-size: 11px; }
  .reveal .card { animation: pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
  @keyframes pop { from { opacity: 0; transform: scale(0.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal .card { animation: none; } }
  .rates-box summary::-webkit-details-marker { display: none; }
  .rates-box summary { list-style: none; justify-content: space-between; }
  .rates-box summary::after { content: '+'; font-size: 20px; color: var(--muted); }
  .rates-box[open] summary::after { content: '−'; }
  .rates-box:not([open]) { padding-top: 4px; padding-bottom: 4px; gap: 0; display: block; }
  .rates-box summary { cursor: pointer; font-weight: 800; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; min-height: 44px; display: flex; align-items: center; }
  .rates { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 14px; font-size: 0.9rem; margin-top: 8px; }
  .rates span { font-variant-numeric: tabular-nums; }

  /* Tutoriel. */
  .tuto {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5, 7, 10, 0.72);
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .tuto-card { width: 100%; max-width: 420px; background: var(--panel); color: var(--ink); border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
  .tuto-card .label { color: var(--muted); }
  .tuto-art svg { display: block; width: 100%; height: auto; border-radius: 12px; }
  .tuto-dots { display: flex; gap: 6px; justify-content: center; }
  .tuto-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .tuto-dots i.on { background: var(--accent); width: 20px; border-radius: 999px; }
  .tuto-actions { display: flex; justify-content: space-between; gap: 10px; }
  .loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; color: var(--ink); font-weight: 700; background: var(--bg); }

  /* Partie : le terrain prend tout l'écran, les menus disparaissent. */
  .stage { display: none; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--stage); }
  body.in-match { overflow: hidden; }
  body.in-match .top, body.in-match .nav, body.in-match .hero, body.in-match .home-body, body.in-match #incoming { display: none !important; }
  body.in-match .stage { display: block; position: fixed; inset: 0; z-index: 40; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hud::before, .hud::after { content: ''; position: absolute; left: 0; right: 0; pointer-events: none; }
  .hud::before { top: 0; height: 150px; background: linear-gradient(rgba(10, 12, 15, 0.85), rgba(10, 12, 15, 0)); }
  .hud::after { bottom: 0; height: 190px; background: linear-gradient(rgba(10, 12, 15, 0), rgba(10, 12, 15, 0.9)); }
  .hud-top {
    position: absolute; z-index: 1; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 14px);
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; color: var(--ink);
  }
  .hud-player {
    display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 10px 6px 6px; border-radius: 16px;
    background: rgba(29, 35, 45, 0.85); border: 2px solid transparent; transition: border-color 0.2s ease;
  }
  .hud-player.opp { justify-content: flex-end; padding: 6px 6px 6px 10px; }
  .hud-player.turn { border-color: var(--accent); }

  /* ================= Terrains ================= */

  const G = 60;

  function genStones() {
    const r = rng(20241031);
    const all = [];
    for (let i = 0; i < 1500; i++) {
      const rad = 0.035 + 0.17 * Math.pow(r(), 2.4);
      const n = 7 + Math.floor(r() * 4);
      const rot = r() * 6.283;
      const poly = [];
      for (let k = 0; k < n; k++) {

      all.push({ x: r() * TARMAC_TILE, z: r() * TARMAC_TILE, r: rad, tone: r(), shade: r(), poly: poly });
    }
    all.sort((a, b) => a.r - b.r);
    const cells = TARMAC_TILE / STONE_CELL;
    const grid = new Map();
    all.filter((s) => s.r > 0.09).forEach(function (s) {
      s.h = 0.2 * s.r;
      const reach = s.r + STONE_REACH;
      for (let i = Math.floor((s.x - reach) / STONE_CELL); i <= Math.floor((s.x + reach) / STONE_CELL); i++) {
        for (let j = Math.floor((s.z - reach) / STONE_CELL); j <= Math.floor((s.z + reach) / STONE_CELL); j++) {
          const key = (((i % cells) + cells) % cells) + ',' + (((j % cells) + cells) % cells);
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(s);
        }

  const STONES = genStones();

  /* La bille qui roule sur un gravillon est poussée vers l'extérieur de la bosse (pente de l'enveloppe du caillou). */
  function stoneAccel(x, z, out) {
    const T = TARMAC_TILE;
    const tx = ((x % T) + T) % T;
    const tz = ((z % T) + T) % T;
    const list = STONES.grid.get(Math.floor(tx / STONE_CELL) + ',' + Math.floor(tz / STONE_CELL));
    out.x = 0;
    out.z = 0;
    if (!list) return out;
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      let dx = tx - s.x;
      let dz = tz - s.z;
      dx -= Math.round(dx / T) * T;
      dz -= Math.round(dz / T) * T;
      const d2 = dx * dx + dz * dz;
      const reach = s.r + STONE_REACH;
      if (d2 >= reach * reach || d2 < 1e-8) continue;
      const q = 1 - d2 / (reach * reach);
      const k = (G * 4 * s.h * q) / (reach * reach);
      out.x += k * dx;
      out.z += k * dz;
    }
    return out;
  }

  function stoneColor(s) {
    const v = s.shade;
    if (s.tone < 0.6) { const l = 72 + v * 42; return [l, l, l + 3]; }
    if (s.tone < 0.86) { const l = 46 + v * 24; return [l, l, l + 2]; }
    if (s.tone < 0.95) return [112 + v * 22, 103 + v * 20, 90 + v * 16];
    const l = 145 + v * 30; return [l, l - 2, l - 5];
  }

  function drawStones(g, size, fill) {
    const sc = size / TARMAC_TILE;
    STONES.all.forEach(function (s) {
      for (let ox = -1; ox <= 1; ox++) {
        for (let oz = -1; oz <= 1; oz++) {
          const cx = (s.x + ox * TARMAC_TILE) * sc;
          const cz = (s.z + oz * TARMAC_TILE) * sc;
          const rr = s.r * sc * 1.2;
          if (cx < -rr || cz < -rr || cx > size + rr || cz > size + rr) continue;
          g.beginPath();
          s.poly.forEach(function (pt, k) {
            if (k === 0) g.moveTo(cx + pt[0] * sc, cz + pt[1] * sc); else g.lineTo(cx + pt[0] * sc, cz + pt[1] * sc);
          });
          g.closePath();
          fill(g, s, cx, cz, s.r * sc);

    });
  }

  function tarmacMaps() {

    }
    drawStones(g, n, function (gg, s, cx, cz, rad) {

      gg.fill();
      gg.lineWidth = Math.max(1, rad * 0.06);
      gg.strokeStyle = 'rgba(10,10,11,0.45)';
      gg.stroke();
    });

  /* Fond des cases : fonte rouillée et sale (sable, poussière, rouille au fond des creux). */

  const POT = { r: 1.3, depth: 0.45 };

  function terreMaps() {

  const terreGroup = new THREE.Group();

  const coverGroup = new THREE.Group();

  scene.add(tarmacGroup);
  coverGroup.visible = false;

  /* ================= Physique ================= */
  const world = new CANNON.World();
  world.gravity.set(0, -G, 0);
  world.broadphase = new CANNON.NaiveBroadphase();
  world.solver.iterations = 14;

  const mGround = new CANNON.Material('ground');
  const mMarble = new CANNON.Material('marble');

  /* Goudron : bordures de trottoir en béton (elles descendent sous le sol pour qu'aucune bille ne passe dessous). */

    const m = new THREE.Mesh(new THREE.BoxGeometry(w[2], WALL_H + 0.5, w[3]), curbMat);
    tarmacGroup.add(m);
    /* Le mur physique monte haut (invisible) : aucune bille ne peut passer par-dessus, même en sautant. */
    tarmacBodies.push(addBox(w[0], 1.25, w[1], w[2], 3.5, w[3], mWall, m));
    m.position.y = WALL_H / 2 - 0.25;
    const plank = new THREE.Mesh(new THREE.BoxGeometry(w[2], WALL_H + 0.5, w[3]), woodMat);
    plank.position.copy(m.position);
    plank.castShadow = true;
    plank.receiveShadow = true;
    terreGroup.add(plank);
  });

  /* Plaque : fond des cases, quadrillage en relief coupé par le cercle, cadre rond. */
  const coverBodies = [];
  (function buildCover() {
    const floor = new THREE.Mesh(new THREE.CircleGeometry(COVER.r + 0.05, 96), new THREE.MeshStandardMaterial({ map: coverFloorMap(), roughness: 0.85, metalness: 0.3 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -COVER.depth + 0.001;
    floor.receiveShadow = true;
    coverGroup.add(floor);
    const H = COVER.depth;
    function ridge(x0, x1, z0, z1) {
      const w = Math.max(x1 - x0, COVER.ridge);
      const d = Math.max(z1 - z0, COVER.ridge);
      if (w < 0.05 || d < 0.05) return;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, H, d), ironFaces);
      coverGroup.add(m);
      coverBodies.push(addBox((x0 + x1) / 2, -H / 2, (z0 + z1) / 2, w, H, d, mGround, m));
    }
    const n = Math.floor(COVER.r / COVER.cell);
    for (let k = -n; k <= n; k++) {
      const c = k * COVER.cell;
      const L = Math.sqrt(Math.max(0, COVER.r * COVER.r - c * c));
      if (L < 0.3) continue;
      ridge(c - COVER.ridge / 2, c + COVER.ridge / 2, -L, L);
      ridge(-L, L, c - COVER.ridge / 2, c + COVER.ridge / 2);
    }
    const ri = COVER.r;
    const ro = COVER.r + COVER.rimW;
    const top = COVER.rimH;
    const rim = new THREE.Mesh(new THREE.LatheGeometry([
      new THREE.Vector2(ri, -H), new THREE.Vector2(ri, top - 0.08), new THREE.Vector2(ri + 0.08, top),
      new THREE.Vector2(ro - 0.08, top), new THREE.Vector2(ro, top - 0.08), new THREE.Vector2(ro, -0.02)
    ], 128), ironTopMat);
    rim.castShadow = true;
    rim.receiveShadow = true;
    coverGroup.add(rim);
    const segs = 48;
    const segLen = (2 * Math.PI * (ri + 0.3)) / segs + 0.08;
    for (let i = 0; i < segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      coverBodies.push(addBox(Math.cos(a) * (ri + 0.3), 1.25, Math.sin(a) * (ri + 0.3), 0.6, 3.5, segLen, mWall, null, -a));
    }
  })();

  /* ================= Billes en 3D ================= */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  /* Studio virtuel : un ciel dégradé et des boîtes à lumière, pour que le verre ait de vrais reflets. */
  function makeEnvironment(r) {
    const envScene = new THREE.Scene();
    const c = document.createElement('canvas');
    c.width = 16;
    c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.45, '#dfe5ec');
    gr.addColorStop(0.55, '#7d868f');
    gr.addColorStop(1, '#262a2f');
    g.fillStyle = gr;
    g.fillRect(0, 0, 16, 256);
    envScene.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ map: makeTexture(c), side: THREE.BackSide })));
    [[-8, 9, 6, 7, 3], [9, 6, -5, 4, 2], [0, 12, -8, 10, 2]].forEach(function (b) {
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(b[3], b[4]), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 4, 4), side: THREE.DoubleSide }));
      panel.position.set(b[0], b[1], b[2]);
      panel.lookAt(0, 0, 0);
      envScene.add(panel);
    });
    const pmrem = new THREE.PMREMGenerator(r);
    const tex = pmrem.fromScene(envScene, 0.04).texture;
    pmrem.dispose();
    return tex;
  }
  scene.environment = makeEnvironment(renderer);

  /* Chaque bille est calculée comme une vraie sphère de verre (indice 1,5) : reflet de Fresnel,
     réfraction qui fait loupe sur l'intérieur, motif en volume traversé par le rayon, teinte du verre
     selon l'épaisseur traversée. Les billes pleines (terre, laiteuse, agate...) ont un vernis brillant. */
  const MARBLE_VS = 'varying vec3 vObj; void main() { vObj = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
  const MARBLE_FS = [
    'uniform int uType; uniform float uSeed; uniform float uCount; uniform float uTwist; uniform float uWidth; uniform float uVariant; uniform float uDensity; uniform vec3 uDir;',
    'uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3; uniform vec3 uAbsorb; uniform vec3 uCamObj; uniform vec3 uSun; uniform vec3 uGround;',
    'uniform mat3 uRot;',
    'varying vec3 vObj;',
    'float hash3(vec3 p) { p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }',
    'float noise3(vec3 x) { vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(mix(hash3(i), hash3(i + vec3(1.0, 0.0, 0.0)), f.x), mix(hash3(i + vec3(0.0, 1.0, 0.0)), hash3(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),',
    '             mix(mix(hash3(i + vec3(0.0, 0.0, 1.0)), hash3(i + vec3(1.0, 0.0, 1.0)), f.x), mix(hash3(i + vec3(0.0, 1.0, 1.0)), hash3(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z); }',
    /* Cellules de Voronoï : donnent des éclats anguleux, chacun avec sa couleur, séparés par de fins joints. */
    'vec4 voro(vec3 x) {',
    '  vec3 i = floor(x); vec3 f = fract(x); float F1 = 8.0; float F2 = 8.0; float id = 0.0;',
    '  for (int a = -1; a <= 1; a++) for (int b = -1; b <= 1; b++) for (int c = -1; c <= 1; c++) {',
    '    vec3 g = vec3(float(a), float(b), float(c));',
    '    vec3 r = g + vec3(hash3(i + g + 0.17), hash3(i + g + 3.71), hash3(i + g + 7.13)) - f;',
    '    float d = dot(r, r);',
    '    if (d < F1) { F2 = F1; F1 = d; id = hash3(i + g + 11.3); } else if (d < F2) { F2 = d; } }',
    '  return vec4(sqrt(F1), sqrt(F2), id, 0.0); }',
    'vec3 chipColor(float id) {',
    '  if (uVariant > 0.5 && uVariant < 1.5) return uC2 * (0.85 + 0.3 * fract(id * 13.7));',
    '  float k = fract(id * 7.31) * 6.0; float m = uVariant < 0.5 ? 0.75 : 1.0;',
    '  return m * (k < 1.0 ? vec3(0.9, 0.35, 0.08) : (k < 2.0 ? vec3(0.2, 0.55, 0.15) : (k < 3.0 ? vec3(0.12, 0.3, 0.75) : (k < 4.0 ? vec3(0.95) : (k < 5.0 ? vec3(0.8, 0.08, 0.08) : vec3(0.95, 0.8, 0.1)))))); }',
    'float chipMask(vec4 vc) { float size = 0.45 + 0.35 * fract(vc.z * 31.7); return step(1.0 - uDensity, vc.z) * smoothstep(0.03, 0.08, vc.y - vc.x) * smoothstep(size, size - 0.06, vc.x); }',
    'float fbm(vec3 p) { float a = 0.5; float s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise3(p); p *= 2.03; a *= 0.5; } return s; }',
    'vec3 env(vec3 d) {',
    '  vec3 sky = mix(vec3(0.62, 0.68, 0.76), vec3(1.15), smoothstep(0.0, 0.9, d.y));',
    '  vec3 col = d.y > 0.0 ? sky : mix(uGround, uGround * 0.55, smoothstep(0.0, -0.7, d.y));',
    '  col += 7.0 * smoothstep(0.975, 0.99, dot(d, normalize(vec3(-0.45, 0.75, 0.45))));',
    '  col += 2.5 * smoothstep(0.96, 0.985, dot(d, normalize(vec3(0.6, 0.45, -0.5))));',
    '  return col; }',
    'vec4 pick(vec4 o, vec3 c, float d) { return d > o.a ? vec4(c, d) : o; }',
    /* Diamant : facettes taillées, indice de réfraction 2,4 et dispersion (chaque couleur est déviée un peu différemment). */
    /* Studio contrasté pour les métaux et le diamant : fond sombre, boîtes à lumière, ligne d'horizon, sol en bas. */
    'vec3 studio(vec3 d) {',
    '  vec3 c = mix(vec3(0.03), vec3(0.32), smoothstep(-0.1, 0.9, d.y));',
    '  if (d.y < 0.0) c = mix(uGround * 0.7, uGround * 0.25, smoothstep(0.0, -0.6, d.y));',
    '  c += 7.0 * smoothstep(0.9, 0.96, dot(d, normalize(vec3(-0.5, 0.7, 0.5))));',
    '  bool metal = uType == 19 || uType == 20;',
    '  c += (metal ? 1.4 : 3.5) * smoothstep(0.88, 0.94, dot(d, normalize(vec3(0.75, 0.35, -0.4))));',
    '  c += (metal ? 0.4 : 1.2) * smoothstep(0.03, 0.0, abs(d.y - 0.04));',
    '  if (!metal) c += 0.8 * smoothstep(0.8, 0.95, dot(d, normalize(vec3(0.1, 0.15, 1.0))));',
    '  return c; }',
    'mat3 seedRot() { float a = uSeed * 6.28318; float b = fract(uSeed * 7.13) * 3.0; return mat3(cos(a), 0.0, sin(a), 0.0, 1.0, 0.0, -sin(a), 0.0, cos(a)) * mat3(1.0, 0.0, 0.0, 0.0, cos(b), sin(b), 0.0, -sin(b), cos(b)); }',
    'vec3 facet(vec3 d) { mat3 m = seedRot(); return normalize(floor(m * d * 3.0 + 0.5) + 0.001) * m; }',
    'vec3 diaPath(vec3 v, vec3 p, float ior) {',
    '  vec3 nf = facet(p); vec3 t = refract(v, nf, 1.0 / ior);',
    '  float L = max(-2.0 * dot(p, t), 0.05); vec3 ex = normalize(p + t * L); vec3 nb = facet(ex);',
    '  vec3 t2 = refract(t, -nb, ior);',
    '  if (dot(t2, t2) < 0.001) { vec3 r1 = reflect(t, -nb); vec3 ex2 = normalize(ex + r1 * 1.2); t2 = refract(r1, -facet(ex2), ior); if (dot(t2, t2) < 0.001) t2 = reflect(r1, -facet(ex2)); }',
    '  return studio(normalize(uRot * t2)); }',
    'vec4 helix(vec3 q, float nb, float twist, float w, float rIn, float rOut) {',
    '  float rho = length(q.xz); float phi = atan(q.z, q.x); vec4 o = vec4(0.0);',
    '  for (int k = 0; k < 4; k++) {',
    '    if (float(k) >= nb) break;',
    '    float phi0 = float(k) * 6.28318 / nb + q.y * twist + uSeed * 6.28318;',
    '    float dphi = abs(mod(phi - phi0 + 3.14159, 6.28318) - 3.14159);',
    '    float d = smoothstep(w, 0.0, dphi * max(rho, 0.05)) * smoothstep(rIn, rIn + 0.1, rho) * smoothstep(rOut, rOut - 0.12, rho);',
    '    vec3 c = k == 0 ? uC1 : (k == 1 ? uC2 : (k == 2 ? uC3 : mix(uC1, vec3(1.0), 0.5)));',
    '    o = pick(o, c, d); }',
    '  return o; }',
    'vec4 sparkle(vec3 q, float scale, float amount) {',
    '  vec3 g = q * scale + uSeed * 37.0; vec3 i = floor(g); vec3 f = fract(g) - 0.5;',
    '  float h = hash3(i); vec3 off = vec3(hash3(i + 1.3), hash3(i + 2.7), hash3(i + 5.1)) - 0.5;',
    '  float d = smoothstep(0.16, 0.0, length(f - off * 0.6)) * step(1.0 - amount, h);',
    '  return vec4(mix(vec3(1.4), vec3(1.6, 1.1, 0.45), step(0.5, hash3(i + 9.1))), d); }',
    'float ell(vec3 q, vec3 c, vec3 r) { return length((q - c) / r) - 1.0; }',
    /* Lutz, d'après une vraie bille : verre très clair, cage de fines lignes brunes d'un pôle à l'autre (avec paillettes cuivrées)
       et deux grandes flammes translucides au centre. */
    'vec4 lutzCore(vec3 q) {',
    '  float r = length(q); float rho = length(q.xz); float phi = atan(q.z, q.x);',
    '  float u = (phi + q.y * uTwist * 0.5) / 6.28318 * 11.0 + uSeed * 11.0;',
    '  float strand = smoothstep(0.065, 0.02, abs(fract(u) - 0.5)) * smoothstep(0.8, 0.83, r) * smoothstep(0.93, 0.9, r);',
    '  vec4 o = vec4(vec3(0.025, 0.012, 0.006), strand);',
    '  vec4 sp = sparkle(q, 40.0, 0.9); if (sp.a * strand > 0.1) o.rgb = vec3(1.4, 0.8, 0.35);',
    '  for (int k = 0; k < 2; k++) {',
    '    float a = uSeed * 6.28318 + float(k) * 1.2 + q.y * 0.6 + rho * 0.8;',
    '    float d = abs(dot(q, vec3(cos(a), 0.0, sin(a))));',
    '    float w = 0.5 * (1.0 - q.y * q.y / 0.85);',
    '    float side = dot(q, vec3(-sin(a), 0.0, cos(a)));',
    '    float dens = smoothstep(0.06, 0.015, d) * smoothstep(w, w - 0.08, rho) * step(0.0, side) * step(abs(q.y), 0.9) * 0.5;',

    '    o = pick(o, c, dens); }',
    '  return o; }',
    /* Petites bulles d'air prises dans le verre, comme sur les billes de cour d'école. */
    'vec4 bubbles(vec3 q) {',
    '  vec3 g = q * 26.0 + uSeed * 91.0; vec3 i = floor(g); vec3 f = fract(g) - 0.5;',
    '  vec3 off = vec3(hash3(i + 3.1), hash3(i + 6.2), hash3(i + 8.3)) - 0.5;',
    '  float rad = 0.06 + 0.1 * hash3(i + 1.9); float d = length(f - off * 0.6);',
    '  float ring = smoothstep(rad, rad * 0.6, d) - smoothstep(rad * 0.6, rad * 0.2, d);',
    '  return vec4(vec3(1.25), ring * step(0.9, hash3(i + 7.7)) * 0.7 * step(length(q), 0.95)); }',
    /* Araignée, d'après de vraies billes (Kim'Play Spider) : anneaux autour d'un pôle, tirés en arches à pointes comme au peigne,
       lignes colorées bordées de fines lignes noires. */
    'vec4 feather(vec3 d) {',
    /* Tracé à la main : le motif est déformé par du bruit, les arches et l'épaisseur des lignes varient. */
    '  vec3 w = d + 0.18 * vec3(fbm(d * 2.2 + uSeed * 7.0), fbm(d * 2.2 + uSeed * 9.0 + 3.1), fbm(d * 2.2 + uSeed * 11.0 + 5.7)) - 0.09;',
    '  w = normalize(w);',
    '  float th = acos(clamp(w.y, -1.0, 1.0)); float phi = atan(w.z, w.x) + 0.35 * sin(th * 3.0 + uSeed * 5.0);',
    '  float lobes = 5.0 + floor(uSeed * 4.0);',
    '  float amp = 0.6 + 0.6 * fbm(vec3(phi * 1.3, th, uSeed * 4.0));',
    '  float v = th / 3.14159 * (8.0 + uWidth * 6.0) + amp * pow(abs(sin(phi * lobes * 0.5 + uSeed * 6.0)), 0.8) * smoothstep(0.1, 0.6, th);',
    '  float f = fract(v); float idx = mod(floor(v), 3.0);',
    '  float wid = 0.22 + 0.14 * fbm(w * 4.0 + uSeed * 2.0);',
    '  float s1 = smoothstep(0.0, 0.03, f) * smoothstep(wid + 0.03, wid, f);',
    '  float s2 = smoothstep(wid + 0.03, wid + 0.05, f) * smoothstep(wid + 0.13, wid + 0.1, f);',
    '  vec3 c = s1 > s2 ? (idx < 0.5 ? uC2 : (idx < 1.5 ? vec3(0.95) : uC3)) : vec3(0.05);',
    '  return vec4(c, max(s1, s2 * 0.9)); }',
    'vec4 spiderGlass(vec3 q) {',
    '  float r = length(q);',
    '  vec4 fb = feather(normalize(q));',
    '  vec4 o = vec4(fb.rgb, fb.a * smoothstep(0.8, 0.84, r) * smoothstep(0.93, 0.9, r));',
    '  float ridge = 1.0 - abs(2.0 * noise3(q * 7.0 + uSeed * 13.0) - 1.0);',
    '  return pick(o, vec3(1.05, 1.03, 0.95), (0.008 + 0.3 * pow(ridge, 10.0)) * smoothstep(0.66, 0.5, r)); }',
    /* Galaxie, d'après de vraies billes : opaque noire, éclaboussée de grosses taches d'une couleur et d'une poussière de points clairs. */
    'float speck(vec3 p, float sc, float prob, float rad) {',
    '  vec3 g = p * sc + uSeed * 41.0; vec3 i = floor(g); vec3 f = fract(g) - 0.5;',
    '  vec3 off = vec3(hash3(i + 1.1), hash3(i + 2.2), hash3(i + 3.3)) - 0.5;',
    '  return smoothstep(rad, rad * 0.6, length(f - off * 0.6)) * step(1.0 - prob, hash3(i + 4.4)); }',
    /* D'après des photos de vraies billes : tout s'enroule comme un ressort autour de la bille et finit en escargot au pôle.
       Tourbillon variante 0 (type Kim'Play) : un fil fin et un cœur blanc argenté craquelé. */
    'vec4 swirlRibbons(vec3 q) {',
    '  float r = length(q); float phi = atan(q.z, q.x);',
    '  if (uVariant < 0.5) {',
    '    float u = q.y * (3.2 + uWidth * 4.0) + phi / 6.28318 * sign(uTwist) + uSeed;',
    '    float line = smoothstep(0.055, 0.02, abs(fract(u) - 0.5));',
    '    float shell = smoothstep(0.76, 0.8, r) * smoothstep(0.93, 0.88, r);',
    '    vec4 o = vec4(uC1, line * shell);',
    '    float ridge = 1.0 - abs(2.0 * noise3(q * 7.0 + uSeed * 13.0) - 1.0);',
    '    float frost = (0.008 + 0.3 * pow(ridge, 10.0)) * smoothstep(0.66, 0.5, r);',
    '    return pick(o, vec3(1.05, 1.05, 1.08), frost); }',
    /* Tornade variantes 1 et 3 : rubans épais empilés en spirale à l'intérieur du verre, deux couleurs collées (opaques ou translucides). */
    '  float u = q.y * (1.6 + uWidth * 2.0) + phi / 6.28318 * sign(uTwist) + uSeed * 4.0;',
    '  float f = fract(u);',
    '  float rho = length(q.xz);',
    '  float inR = smoothstep(0.08, 0.15, rho) * smoothstep(0.52, 0.45, rho) * smoothstep(0.82, 0.74, abs(q.y));',
    '  float a1 = smoothstep(0.0, 0.03, f) * smoothstep(0.22, 0.19, f);',
    '  float a2 = smoothstep(0.22, 0.25, f) * smoothstep(0.42, 0.39, f);',
    '  vec3 c = a1 > a2 ? uC1 : uC2;',
    '  float pos = a1 > a2 ? f / 0.22 : (f - 0.22) / 0.2;',

    '  float dens = max(a1, a2) * inR;',
    '  if (uVariant > 2.5) { dens *= 0.08; c = mix(c, vec3(1.0), 0.15) * 1.3; }',
    '  return vec4(c, dens); }',
    'vec4 core(vec3 q) {',
    '  if (uType == 6) {',
    '    float rho = length(q.xz); vec4 o = vec4(0.0);',
    '    for (int k = 0; k < 4; k++) {',
    '      if (float(k) >= uCount) break;',
    /* Pétales fins et courbés comme des flammes, bords presque lisses, fines stries dans la longueur. */
    '      float a = uSeed * 6.28318 + float(k) * 3.14159 / uCount + q.y * uTwist + rho * 1.3 * sign(uTwist);',
    '      float d = abs(dot(q, vec3(cos(a), 0.0, sin(a))));',
    '      float w = uWidth * (1.0 - q.y * q.y / 0.8);',
    '      float edge = smoothstep(w, w - 0.05, rho + 0.012 * sin(q.y * 5.0 + float(k) * 2.1));',
    '      float dens = smoothstep(0.035, 0.008, d) * edge * step(abs(q.y), 0.9);',
    '      vec3 c = k == 0 ? uC1 : (k == 1 ? uC2 : (k == 2 ? uC3 : uC1));',
    '      c *= 0.94 + 0.06 * sin(q.y * 22.0 + rho * 10.0);',
    '      o = pick(o, c, dens); }',
    '    return o; }',
    '  if (uType == 7) return swirlRibbons(q);',
    '  if (uType == 8) return swirlRibbons(q);',
    '  if (uType == 9) { vec4 s = sparkle(q, 16.0, 0.4); s.a *= step(length(q), 0.95); return s; }',
    '  if (uType == 10) return lutzCore(q);',
        '  if (uType == 16) return spiderGlass(q);',
    '  return vec4(0.0); }',
    'vec3 solidAlbedo(vec3 p, float cosi) {',
    '  if (uType == 0) return uC1 * (0.85 + 0.3 * fbm(p * 2.5 + uSeed * 9.0));',
    '  if (uType == 1) return mix(vec3(0.92, 0.93, 0.95), uC1, 0.35 * smoothstep(0.35, 0.8, fbm(p * 2.2 + uSeed * 5.0)));',
    /* Agate de cour d'école, d'après photos : verre blanc laiteux et une tache de couleur qui fait une partie du tour,
       avec des stries blanches. Variante 1 : deux couleurs collées. Variante 2 : deux fines lignes ondulées. */
    '  if (uType == 2) {',
    '    vec3 ax = normalize(cross(uDir, vec3(sin(uSeed * 9.0), cos(uSeed * 9.0), 0.5)));',
    '    float front = dot(p, uDir);',
    '    float s = atan(dot(p, cross(ax, uDir)), front);',
    '    float t = dot(p, ax) + 0.18 * (fbm(p * 2.5 + uSeed * 4.0) - 0.5) + 0.32 * sin(s + uSeed * 3.0) + 0.08 * sin(2.0 * s + uSeed * 5.0);',
    '    float extent = smoothstep(-0.35, 0.5, front);',
    '    vec3 base = vec3(0.9, 0.91, 0.93);',
    '    if (uVariant > 1.5) {',
    '      float l1 = smoothstep(0.04, 0.022, abs(t)) * extent; float l2 = smoothstep(0.035, 0.018, abs(t - 0.3)) * extent;',
    '      return mix(mix(base, uC1, l1), uC2, l2); }',
    '    float w = max((0.32 + 0.25 * uWidth) * extent, 0.002);',
    '    float band = smoothstep(w, w * 0.15, abs(t));',
    '    float streak = smoothstep(0.55, 0.75, noise3(vec3(s * 3.0, t * 14.0, uSeed * 5.0)));',
    '    vec3 col = mix(uC1, vec3(0.95), streak * 0.5);',
    '    if (uVariant > 0.5 && t < -w * 0.15) col = mix(uC2, vec3(0.95), streak * 0.4);',
    '    return mix(base, col, band); }',
    '  if (uType == 7) { float phi = atan(p.z, p.x); float u = p.y * (2.0 + uWidth * 3.0) + phi / 6.28318 * sign(uTwist) + uSeed * 4.0 + fbm(p * 3.0 + uSeed * 5.0) * 0.15;',
    '    float b = fract(u * 2.0); float idx = mod(floor(u * 2.0), 3.0);',
    '    float band = smoothstep(0.0, 0.04, b) * smoothstep(0.3, 0.24, b);',
    '    vec3 c = idx < 0.5 ? uC1 : (idx < 1.5 ? uC2 : vec3(0.98));',
    '    return mix(mix(vec3(0.94, 0.93, 0.9), uC3, 0.85), c, band); }',
    '  if (uType == 15) {',
    '    float sp = smoothstep(0.8 - uDensity * 0.2, 0.85 - uDensity * 0.2, fbm(p * 4.5 + uSeed * 9.0) + 0.3 * noise3(p * 28.0 + uSeed * 3.0));',
    '    vec3 c = mix(vec3(0.012, 0.014, 0.025), uC1, sp);',

    '    c = mix(c, mix(uC1, uC2, 0.5), speck(p, 24.0, 0.3, 0.3));',

    '  if (uType == 14) { vec4 vc = voro(p * uWidth + uSeed * 17.0); return mix(uC1, chipColor(vc.z), chipMask(vc)); }',
    '  if (uType == 16) { vec4 fb = feather(p); return mix(uC1 * (0.9 + 0.2 * fbm(p * 4.0 + uSeed * 3.0)), fb.rgb, fb.a); }',
    '  if (uType == 13) { float wear = smoothstep(0.55, 0.75, fbm(p * 5.0 + uSeed * 3.0)); return mix(uC1 * (0.8 + 0.3 * fbm(p * 9.0)), vec3(0.55, 0.3, 0.18), wear); }',
    '  if (uType == 17) { float phi = atan(p.z, p.x); float u = phi / 6.28318 * 12.0 + uSeed * 12.0; float line = smoothstep(0.1, 0.05, abs(fract(u) - 0.5) - 0.33);',
    '    return mix(vec3(0.93, 0.93, 0.9), mod(floor(u), 2.0) < 0.5 ? uC1 : uC2, 1.0 - line); }',
    '  if (uType == 4) return vec3(0.82) + 0.18 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + cosi * 1.4 + uSeed));',
    '  float phi = atan(p.z, p.x); float s = fract(phi / 6.28318 * 9.0 + fbm(p * 3.0 + uSeed * 3.0) * 0.9 + p.y * 0.4);',
    '  return s < 0.25 ? uC1 : (s < 0.5 ? vec3(0.95) : (s < 0.75 ? uC2 : uC3)); }',
    'void main() {',
    '  vec3 p = normalize(vObj); vec3 n = p;',
    '  vec3 v = normalize(p - uCamObj);',
    '  float cosi = clamp(dot(-v, n), 0.0, 1.0);',
    '  float F = 0.04 + 0.96 * pow(1.0 - cosi, 5.0);',
    '  vec3 refl = env(normalize(uRot * reflect(v, n)));',
    '  vec3 col;',
    '  bool solid = uType <= 5 || uType == 13 || uType == 15 || uType == 17 || (uType == 7 && uVariant > 1.5) || (uType == 16 && uVariant < 0.5) || (uType == 14 && abs(uVariant - 1.0) > 0.5);',
    /* Dorée et Argentée : métal poli, toute la couleur vient du reflet (Fresnel de Schlick avec la teinte du métal). */
    '  if (uType == 19 || uType == 20) {',
    '    vec3 F0 = uType == 19 ? vec3(1.0, 0.71, 0.29) : vec3(0.95, 0.94, 0.92);',
    /* Texture du métal : surface légèrement martelée, reflet un peu flou (métal pas parfaitement poli),
       fines rayures et zones un peu ternies. */
    '    vec3 bump = vec3(fbm(p * 11.0 + uSeed * 3.0), fbm(p * 11.0 + uSeed * 3.0 + 7.1), fbm(p * 11.0 + uSeed * 3.0 + 13.7)) - 0.5;',
    '    vec3 fine = vec3(noise3(p * 70.0), noise3(p * 70.0 + 5.0), noise3(p * 70.0 + 9.0)) - 0.5;',
    '    vec3 nb = normalize(n + 0.13 * bump + 0.008 * fine);',
    '    vec3 Fs = F0 + (1.0 - F0) * pow(1.0 - clamp(dot(-v, nb), 0.0, 1.0), 5.0);',
    '    vec3 rv = reflect(v, nb); vec3 refl4 = vec3(0.0);',
    '    for (int k = 0; k < 4; k++) {',
    '      float fk = float(k) * 1.5708 + 0.4; vec3 o = vec3(cos(fk), sin(fk), cos(fk * 2.0 + 1.0)) * 0.5;',
    '      refl4 += studio(normalize(uRot * normalize(rv + o * 0.12)));',
    '    }',
    '    col = refl4 * 0.25 * Fs * (uType == 19 ? 1.25 : 1.0);',
    '    float sc1 = smoothstep(0.03, 0.0, 0.5 - abs(fract(dot(p, normalize(vec3(1.0, 0.3, 0.2))) * 38.0 + noise3(p * 6.0) * 3.0) - 0.5));',
    '    float sc2 = smoothstep(0.03, 0.0, 0.5 - abs(fract(dot(p, normalize(vec3(-0.2, 1.0, 0.6))) * 29.0 + noise3(p * 5.0 + 2.0) * 3.0) - 0.5));',
    '    float scratches = max(sc1 * step(0.6, noise3(p * 4.0 + uSeed)), sc2 * step(0.65, noise3(p * 4.0 + uSeed + 9.0)));',
    '    col *= (0.8 + 0.2 * fbm(p * 3.0 + uSeed * 5.0)) * (1.0 - 0.35 * scratches);',
    '  } else if (uType == 21) {',
    '    vec3 nf = facet(p);',
    '    float cf = clamp(dot(-v, nf), 0.0, 1.0);',
    '    float Ff = 0.17 + 0.83 * pow(1.0 - cf, 5.0);',
    '    vec3 rr = studio(normalize(uRot * reflect(v, nf)));',
    '    vec3 tr = vec3(diaPath(v, p, 2.36).r, diaPath(v, p, 2.42).g, diaPath(v, p, 2.5).b);',
    '    col = rr * Ff + tr * (1.0 - Ff) * 1.15;',
    '  } else if (solid) {',
    /* Galaxie : surface légèrement granuleuse, le reflet est un peu brouillé. */
    '    vec3 ns = uType == 15 ? normalize(n + 0.08 * (vec3(noise3(p * 35.0), noise3(p * 35.0 + 7.0), noise3(p * 35.0 + 13.0)) - 0.5)) : n;',
    '    if (uType == 15) { refl = env(normalize(uRot * reflect(v, ns))); F *= 0.8; }',
    '    vec3 nW = normalize(uRot * ns);',
    '    vec3 alb = solidAlbedo(p, cosi);',
    '    float diff = max(dot(nW, uSun), 0.0);',
    '    float wrap = (uType == 1 || uType == 2) ? max((dot(nW, uSun) + 0.6) / 1.6, 0.0) : diff;',

    '    if (uType == 4) F = max(F, 0.08);',
    '    if (uType == 13) { F *= 0.25; lit *= 0.95; }',
    '    if (uType == 14) { vec4 vc = voro(p * uWidth + uSeed * 17.0); lit *= mix(1.0, 0.7 + 0.3 * smoothstep(0.03, 0.2, vc.y - vc.x), chipMask(vc)); }',
    '    col = mix(lit, refl, F);',
    '  } else {',
    '    vec3 t = refract(v, n, 1.0 / 1.5);',
    '    float L = -2.0 * dot(p, t);',
    '    vec4 acc = vec4(0.0);',
    '    float jit = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);',

    '      vec3 q = p + t * ((float(i) + jit) / 40.0 * L);',
    '      vec4 c = core(q);',
    '      if (uType == 6 || uType == 12 || uType == 14) { vec4 bb = bubbles(q); c = bb.a > c.a ? bb : c; }',
    '      float a = clamp(c.a * (uType == 8 || uType == 7 || uType == 10 ? 0.85 : 0.6), 0.0, 1.0);',
    '      acc.rgb += (1.0 - acc.a) * a * c.rgb;',
    '      acc.a += (1.0 - acc.a) * a;',
    '      if (acc.a > 0.97) break; }',
    '    vec3 ex = p + t * L; vec3 nOut = normalize(ex);',
    '    vec3 t2 = refract(t, -nOut, 1.5);',
    '    if (dot(t2, t2) < 0.001) t2 = reflect(t, -nOut);',
    '    vec3 trans = exp(-uAbsorb * L);',
    '    vec3 bg = env(normalize(uRot * t2)) * trans;',
    '    col = refl * F + (1.0 - F) * (acc.rgb * mix(vec3(1.0), trans, 0.5) + (1.0 - acc.a) * bg); }',
    /* Pépite en verre teinté : éclats d'une couleur collés en surface, bords plus sombres pour le relief. */
    '  if (uType == 14 && uVariant > 0.5 && uVariant < 1.5) {',
    '    vec4 vc = voro(p * uWidth + uSeed * 17.0);',
    '    float chip = chipMask(vc);',
    '    vec3 nW = normalize(uRot * n);',
    '    vec3 gl = chipColor(vc.z) * (env(nW) * 0.4 + vec3(1.0) * max(dot(nW, uSun), 0.0)) * (0.7 + 0.3 * smoothstep(0.03, 0.2, vc.y - vc.x));',
